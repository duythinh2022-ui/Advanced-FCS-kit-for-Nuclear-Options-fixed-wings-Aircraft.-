[1. General]

## Stock (default) = Aryx's original thrust, parasitic drag and fuel burn; from 2.2.3 (rebuilt) 35 % of the AoA-dependent drag is removed up to 25 deg AoA, faded out by 30 (post-stall drag is Aryx's), see StockAoADragRelief. Buffed = thrust x1.08, parasitic drag x0.885, the same low-AoA drag relief going over to 0.25 post-stall, transonic drag relief 0.2, fuel burn x0.75. Countermeasures and gun ammo come from the matching Countermeasures section below. The flight control is the same in both. Switch before spawning: thrust, drag, countermeasures and ammo are set when a jet spawns and stay until it respawns; fuel burn follows the setting live.
# Setting type: PerformanceProfile
# Default value: Stock
# Acceptable values: Buffed, Stock
PerformanceProfile = Buffed

## 2.2.6: what commands the brake. true = the brake key / axis only; idle throttle is just idle. In the AIR the brake key is the stock speedbrake (the airframe's split / speedbrake panels, opened only as far as AirbrakeAoAFade allows); on the GROUND (main wheels down) the rollout aero-brake (Ground section of the dev file: flaperons and ailerons up, stabilators up, nozzles up, rudders toed in) and never the speedbrake. false = 2.4.15: fully stock: throttle at zero opens the panels fully, in the air and on the ground; the brake key is the wheel brake only (it no longer opens the airbrake, so Brake and Countermeasures can share a controller button); no rollout aero-brake. Only while the FCS flies the jet.
# Setting type: Boolean
# Default value: true
ThrottleIndependentAirbrake = true

## Replace the stock fly-by-wire with the F-22E FCS (player aircraft only).
# Setting type: Boolean
# Default value: true
Enabled = true

## 2.0.6: true = the pitch stick is a pitch-rate command in every mode (gear up or down, on the runway, Stability Assist on or off), like the gear-down law. With Stability Assist on, the AoA and G limits and AoA protection still apply; with it off (MPO) the MPO limits apply as before. false = AoA/G command with the gear up (default). Takes effect at once.
# Setting type: Boolean
# Default value: false
PitchRateCommandOnly = false

## 2.1.0: the gear-up pitch law (Stability Assist on). GAndPitchRate (default) = the stick commands pitch rate where full G is out of reach (low IAS) and G where it is in reach, blended as before; no AoA command - the AoA limits, the low-thrust / asymmetric-load caps and AoA protection still apply as limits. GAoAAndPitchRate = the 1.9-2.0 law: AoA command at low IAS (stick curve in section 5), G command at high IAS, pitch-rate command past the hand-over AoA. AoAThenRateHold (2.1.8) = as GAoAAndPitchRate, but once the stick is steady and the AoA has settled on its command, the pitch rate the jet has then is held instead of the AoA (the AoA drifts with speed); moving the stick goes back to AoA command. PitchRateCommandOnly = true overrides all of them. Takes effect at once.
# Setting type: PitchCommandLaw
# Default value: GAndPitchRate
# Acceptable values: GAndPitchRate, GAoAAndPitchRate, AoAThenRateHold
PitchCommandLaw = GAndPitchRate

## Time constant (s) of the first-order smoothing on pitch/roll/pedal inputs. 0 = off.
# Setting type: Single
# Default value: 0.06
StickSmoothing = 0.06

