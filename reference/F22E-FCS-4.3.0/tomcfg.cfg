## AI F-22Es only: while the AI points its nose (guns) at a moving target, its roll stick is faded out when the aim error is under ~6 deg (none under 1 deg). Near the aim point the AI's 'put the lift vector on the target' roll logic has no stable answer and flips between rolling left and right every second; pitch and rudder close the last few degrees instead. false = off.
