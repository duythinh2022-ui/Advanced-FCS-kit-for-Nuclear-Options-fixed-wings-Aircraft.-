## AI F-22Es only: the AI's roll stick drives the velocity-vector roll rate almost directly (up to the jet's roll authority, still capped by the yaw authority at high AoA), like the stock fly-by-wire, instead of through the player's smooth roll trajectory. The AI's roll autopilot is a PID tuned for the stock response; the extra lag of the smooth trajectory made it overshoot and roll back and forth. false = 1.8.24 behaviour.
