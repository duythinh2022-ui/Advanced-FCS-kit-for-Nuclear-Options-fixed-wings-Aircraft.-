[6. Lateral governor]

## 2.2.8 (2.2.23: default 0 -> 0.7; 2.2.26: 1; 2.2.27: back to 0.7): in a rolling pull held back by the sideslip governor, how much of the AoA rise you ask for is bought back by slowing the roll (the sideslip a rising AoA makes goes as roll rate x AoA rate). 0 = roll kept, AoA rise limited (2.2.7). 1 = roll slowed (to no less than 30 deg/s) until the asked AoA rise fits the sideslip margin; in between, the roll limit goes that share of the way. The roll comes back once the AoA rise is no longer limited. 2.2.11: above ~180-230 kt (2.2.12; 2.2.11: 230-280) the roll limit is also set ahead of time from the AoA rate the stick asks for, so the roll does not build past what the yaw can coordinate before the governor reacts. Takes effect at once.
# Setting type: Single
# Default value: 0.7
PullRollTrade = 0.7

## 2.4.17 (2.5.0: 3 -> 4; the margin at low AoA, up to 10 deg): sideslip (deg) a roll stop or reversal is allowed to make; RollStopSideslipGovernor caps the commanded roll rate to it. Lower = slower rolls at moderate AoA, cleaner stops. Allowed 1-15. Takes effect at once.
# Setting type: Single
# Default value: 4
RollStopSideslip = 4

## 2.9.4: sideslip (deg) a push-over from high AoA may make at the zero crossing from the yaw rate still on board. The sweep is paced so the yaw above what that allowance can absorb (r = sqrt(2 x measured shed x allowance)) is shed before the AoA reaches zero; the rest is left to the rudders at low AoA. Higher = faster nose-down with a high yaw rate on, more sideslip at the bottom. -1 = RollStopSideslip. 0-20. Takes effect at once.
# Setting type: Single
# Default value: -1
PushoverSideslip = -1

## 2.5.2, rebuilt 2.5.3: roll first, then pitch, both ways. With the roll already held to its cap, the AoA rate the pitch law may command under the roll is held to what the yaw can pay for: an AoA sweep changes the yaw the pair needs at roll rate x cos AoA x AoA rate. Nose-up at positive AoA: 0.8 x the rudders' braking yaw not yet in use on the roll's side (so the pull yields as the rudders fill instead of 0.3 s after they pin), faded in with the rudders' braking yaw (40-55 deg/s^2) and only as the sideslip heads for the margin (from half of it, measured sideslip plus 0.3 s of its kinematic rate) - a rolling pull that pins the rudders but holds its sideslip keeps its pitch rate. Every other sweep (nose-down anywhere, nose-up from negative AoA): the 2.1.8 sweep yaw limit's capacity (0.5 x the yaw authority, plus half the roll's) from the same rule, at every IAS - this is what keeps a full push + full roll from sweeping the yaw demand through zero faster than the rudders can swing. Never under 6 deg/s of AoA rate; released over 0.3 s. false = the trade alone. Takes effect at once.
# Setting type: Boolean
# Default value: true
RollGovernorPitch = true

## 2.5.10 (RollPaceRateMode): how much of the sideslip margin the roll-rate cap spends - the roll rate / sideslip compromise. 1 = the cap aims a full stick reversal at the margin as set (2.5.8). Above 1 the cap aims past the margin and lets the roll run faster: the bench reversal sweep (450-700 km/h, 10-29 deg AoA, margin 15) gives worst / mean sideslip and mean roll rate of 5.8 / 3.9 at 52 deg/s for 1.0, 8.3 / 4.8 at 59 for 1.25, 9.4 / 5.4 at 62 for 1.43, 10.7 / 6.3 at 67 for 1.67, 13.0 / 7.6 at 74 for 2.0, against 10.9 / 8.0 at 83 with no cap at all; the game's worst held-roll reversal reads about 1.4x the bench's worst. Below 1 the cap is stricter than the margin. Allowed 0.5-3. Takes effect at once.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 3
RollPaceRateSlip = 1

## 2.5.11 (2.6.9: default 0.4084507 again, and the rate cap only counts where the rudders are the yaw axis - it fades out with the rudders past ~50 deg AoA, so the falling-leaf yaw rate is not taxed): how the pace governor splits its work between the two laws. 0 = 2.5.7 pacing only (the yaw-reach window holds the roll target while the yaw catches up, and the trajectory's acceleration / braking is capped at the yaw's authority: reversals are paced, the margin does not matter). 1 = 2.5.8 rate cap only (the target is capped at the rate whose stick reversal lands on the sideslip margin x RollPaceRateSlip; acceleration and braking stay as tuned: reversals are crisp, the rate is lower). Between: the target is the proportional mix of the two laws' targets and the acceleration cap gives way to the tuned acceleration in the same proportion. Allowed 0-1. Takes effect at once.
# Setting type: Single
# Default value: 0.4084507
# Acceptable value range: From 0 to 1
RollPaceRateBlend = 0.4084507

## 2.5.15: the airframe's own sideslip tolerance, measured from its aero tables in flight - no number entered. Twice a second the FCS evaluates the whole airframe (every aero part at the game's per-part law, the surfaces where they are) at the present AoA and a sweep of hypothetical sideslip to 20 deg each way, and finds the sideslip where the restoring yaw moment stops growing (directional stiffness gone - the departure boundary) and where the rudders' or the roll surfaces' authority has fallen to half of its zero-sideslip value. The smaller, x 0.7, caps RollStopSideslip. On an airframe with nothing inside 20 deg (the F-22E at 25-45 deg AoA, by the 31 Oct pedal flight) the cap never binds and RollStopSideslip rules; on one with a soft fin it binds where the fin gives out. Telemetry: slipTol / slipDep / slipAuth / slipStiff. false = RollStopSideslip alone. Takes effect at once.
# Setting type: Boolean
# Default value: true
RollStopSlipProbe = true

