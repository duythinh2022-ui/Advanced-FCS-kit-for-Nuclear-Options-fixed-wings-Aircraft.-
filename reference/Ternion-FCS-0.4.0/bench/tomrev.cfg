[1. General]

## Stock (default) = the game's FS-12 Revoker thrust, parasitic drag and fuel burn. Buffed = thrust x1.08 (dry and afterburner), parasitic drag x0.90, fuel burn x0.65 at every throttle setting (35 % less). Countermeasures and gun ammo come from the matching Countermeasures section below. The flight control is the same in both. Switch before spawning: thrust, drag, countermeasures and ammo are set when a jet spawns and stay until it respawns; fuel burn follows the setting live.
# Setting type: PerformanceProfile
# Default value: Stock
# Acceptable values: Buffed, Stock
PerformanceProfile = Buffed

## What opens the Revoker's airbrake. true = the brake key / axis only, in the air and on the ground; idle or zero throttle never opens it. false = 0.2.6: the stock rule only: throttle at zero opens it; the brake key is the wheel brake only (it no longer opens it, so Brake and Countermeasures can share a controller button). Only while the FCS flies the jet.
# Setting type: Boolean
# Default value: true
ThrottleIndependentAirbrake = true

## Revoker 0.2.8: the brake also sets the control surfaces as the F-22E does. In the air, with the airbrake out: inboard elevons trailing edge down, outboard elevons trailing edge up, moved as fast as the actuators go (0.2.9), with the outboard share solved for zero added lift and the canards trimming the pitch; roll stays on the differential. On the runway (main wheels down, brake held, stick not pulled back, from touchdown on): every trailing-edge surface fully up to dump the wing lift and the canards leading edge fully down for drag and nose-wheel load. Needs ThrottleIndependentAirbrake = true (with it false the airbrake is fully stock). false = the dedicated airbrake only (0.2.7). Takes effect at once.
# Setting type: Boolean
# Default value: true
