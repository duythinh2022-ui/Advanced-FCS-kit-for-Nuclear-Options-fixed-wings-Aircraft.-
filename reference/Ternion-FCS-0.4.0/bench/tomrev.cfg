## The lateral law with Stability Assist off (MPO). VelocityVectorRoll = as with it on: the stick rolls about the velocity vector, the sideslip is held and the pedals work as they do with it on. SeparateRollYaw (default) = Revoker 0.2.7: the stick rolls about the velocity vector at every AoA (sideslip held while the stick is in and the pedals centred) and the pedals command pure body yaw rate at every AoA (no sideslip limit on them; with both centred, below the coupling AoA, sideslip washes out slowly as before). Before 0.2.7 the stick was body roll, coordinated below the coupling AoA by a sideslip limit on the yaw axis. Takes effect at once.
