# Setting type: Boolean
# Default value: true
SlipGovLeadFromLoops = true

## Ifrit 0.3.9: below this true airspeed (m/s) the roll is not held back for sideslip or yaw coordination (sideslip guard / governor, yaw-anchored roll limit, roll-acceleration coordination cap); they come back in over RollSlackTASSpan (smoothstep) and are off past 120 deg |AoA|. Higher = more roll slack at low speed, more sideslip.
# Setting type: Single
# Default value: 25
RollSlackMinTAS = 25

## Ifrit 0.3.9: m/s over which the roll limiters come back in above RollSlackMinTAS (default: full from 75 m/s TAS, 270 km/h). Bench, full stick from near zero airspeed accelerating to 250 km/h: 25/50 holds 21-44 deg/s where 20/30 sat at 11 deg/s; corkscrew from 150 km/h and slow rolls unchanged.
# Setting type: Single
# Default value: 50
RollSlackTASSpan = 50

## Ifrit 0.3.7: the sideslip hold is off below this true airspeed (m/s) and fades in over SlipHoldTASSpan; it also fades out from 100 to 120 deg |AoA| (flying backwards). Pedals keep commanding yaw there. In tail slides and near zero airspeed the hold asked for yaw it had no authority for: the jet swayed left/right and the roll stick was scaled to nothing. 0 = 0.3.6 at speed (reversed-flow fade still applies).
# Setting type: Single
# Default value: 15
SlipHoldMinTAS = 15

## Ifrit 0.3.7: m/s over which the sideslip hold fades in above SlipHoldMinTAS (default: full from 35 m/s TAS).
# Setting type: Single
# Default value: 20
SlipHoldTASSpan = 20

## Ifrit 0.3.5: sideslip predictor window (s), the inner roll/yaw rate loops' lag in game (~0.3 s in the 20 Oct logs). The sideslip correction works on the sideslip minus the yaw (stability-axis) rate it has already commanded over this window, which has not reached the sideslip yet. Fixes the 0.7 Hz sideslip / roll oscillation at the high-AoA sideslip gain (20 Oct 22:37 and 23:10 logs). 0 = off (0.3.2). Replaces 0.3.3's SlipRateLead.
# Setting type: Single
# Default value: 0.3
SlipPredictTime = 0.3

## Ifrit 0.4.0: roll-stick fraction over which the sideslip predictor fades OUT (0.3.5-0.3.9: 0.2, i.e. the predictor was off whenever roll stick was in). 0 = the predictor runs with roll stick in too. 22 Oct 00:30 log, 65 deg AoA corkscrew at 55 m/s with full roll stick held: without the predictor the high-AoA sideslip loop (gain 4) rang against the ~0.34 s inner-loop lag, sideslip +-12 deg and body roll +-50 deg/s on a 1.6 s cycle, every roll surface and the nozzles bang-bang on their stops. A delay-loop model with that lag and 60-100 deg/s^2 of roll authority reproduces the +-10-12 deg cycle without the predictor and settles 12 -> -1.5 -> 0.5 deg in 1.6 s with it.
# Setting type: Single
# Default value: 0
SlipPredictRollGate = 0

## Ifrit 0.4.0: least drag first with an engine out or a damaged yaw axis. The canted tails carry the yaw as long as they can; the inner/outer flaperon crossing comes next (the allocator finds it), the split decelerons open only for the yaw still out of reach (a gate on measured yaw saturation that leaks shut once the yaw is met, the split then having priority over its deceleron's deflection for their shared travel), the VMC throttle limit last. Bench, yaw per kN of added drag at 250 km/h and 20 deg AoA: tails +-10 deg 4.8 deg/s^2, crossing 1.1-1.5, one split at 30 deg 0.4 (17.7 kN of drag), the throttle cut 0.17, false = 0.3.9 (tails and splits one tier, the split free: with the right engine alone at 140 m/s the left split sat at 15-24 deg while the tails held +-2 deg; at the 30 deg cap the flaperons crossed with the splits shut and the engine cut to 30-40 %). Both engines running: no change.
# Setting type: Boolean
# Default value: true
SplitYawTier = true

## Ifrit 0.4.0 (SplitYawTier): with an engine out or a damaged yaw axis, how far (0-1) the roll-fight cost is relaxed for the canted tails, so their differential may buy yaw with the wing taking the roll back. 0 = the 1.8.41 fight cost in full (the allocator then prefers sideslip or the splits to a tail difference).
# Setting type: Single
# Default value: 1
StabYawRelax = 1

## Ifrit 0.3.5: washout (s) on the predictor's command history, so a held correction (e.g. a yaw trim against a load) leaves no extra steady sideslip. 0 = no washout.
# Setting type: Single
# Default value: 1.5
SlipPredictWashout = 1.5

## Ifrit 0.3.4 (ReversedFlowRollSense): |AoA| (deg) where the roll stick sense starts to turn over for reversed flow. It blends smoothly to fully flipped at ReversedFlowSenseEnd, passing through zero. 0.3.2 flipped at once at 100 deg (released at 80), next to 90 deg, where the velocity-vector roll is nearly all body yaw, so the flip reversed the rotation mid-manoeuvre.
# Setting type: Single
# Default value: 120
ReversedFlowSenseStart = 120

## Ifrit 0.3.4: |AoA| (deg) where the roll stick sense is fully flipped for reversed flow (see ReversedFlowSenseStart).
# Setting type: Single
# Default value: 150
ReversedFlowSenseEnd = 150

## Ifrit 0.3.1: AoA (deg) where the SlipGainHighAoA ramp starts (0.3.0: 25); it reaches SlipGainHighAoA 20 deg higher. Pedals centred only. Bench, corkscrew entry at 475 km/h: from 25 the sideslip built at 15-20 deg AoA and the rolling-pull governor held the AoA there (the 20 deg hitch).
# Setting type: Single
# Default value: 5
SlipGainAoAStart = 5

## Revoker 0.1.0: the nozzle's stock yaw axis (+-15 deg, controlInputs.yaw x thrustVectoring.y) is an allocator effector, in the first yaw tier with the rudder. The game zeroes it under 3 m radar altitude and above 250 m/s (with pitch). false = pitch-only TVC (F-22E principle).
# Setting type: Boolean
# Default value: true
YawTvc = true

## Revoker 0.2.2: with roll stick held above ~35-50 deg AoA (pedals centred), sideslip (deg) the sideslip hold lets build before it takes the yaw back; the corkscrew keeps rotating. 0 = 0.2.1.
# Setting type: Single
# Default value: 0
CorkscrewSlipTol = 0

## Revoker 0.2.7: 1 (F-22E/Ifrit 0.35). The allocator's roll-axis weight from 40 deg AoA (blended in from 20) while the nozzles do not cover pitch (TVC off or the low-thrust T/W); with them covering it stays 0.35. With the roll target out of reach the pitch (weight 8) and yaw (YawPriority) axes took everything at 0.35 and the roll went the wrong way for moments, which with the game's surface lag set up a ~0.6 Hz cycle of every surface stop to stop (28 Oct 20:31 log, TVC off at the 50 deg cap). Bench, TVC off, 50 deg loaded rolls with a game-like 4-frame command delay: surface slew peaks 35-70 -> 10-45 deg/s, sideslip 6.2-6.9 -> 2.9-4.6 deg, roll 24-27 -> 29-33 deg/s. Takes effect at once.
# Setting type: Single
# Default value: 1
HighAoARollWeight = 1

## Revoker 0.2.7: above 30 deg AoA either sign, with lateral input in, the canards are walked into the deflections where their own flow still has lift slope (|local AoA| <= the foil's knee + CanardWindowMargin), when their travel reaches them. Past the knee the allocator sees no roll / yaw gradient on a canard and parked them stalled (28 Oct 21:18 log, full push + roll at -50 deg: both canards at -1 deg, local AoA -48..-50, for 20 s). false = 0.2.6. Takes effect at once.
# Setting type: Boolean
# Default value: true
CanardAttachedWindow = true

## Revoker 0.2.7: local AoA (deg) past the canard foil's lift-slope knee (15.8 deg) that CanardAttachedWindow allows. Bench: 6 cost up to 5 deg of AoA in 50 deg roll reversals, 12 held it within 2-4.
# Setting type: Single
# Default value: 12
CanardWindowMargin = 12

## Revoker 0.2.7: with the fin gone (yawHealth under 0.5) the engines keep vectoring above their 250 m/s cut-off (raised to 1000 m/s on this jet, put back when the fin is whole or the FCS lets go). The yaw nozzle is the only yaw axis then; at the cut-off the game zeroes the nozzles and the jet yawed round (28 Oct 21:22 log, fin + wings gone, 247 m/s). false = the game's cut-off always. Takes effect at once.
# Setting type: Boolean
# Default value: true
FinLossTvcHold = true

## Revoker 0.2.1: with the yaw nozzle active, the sideslip gain ramps to SlipGainHighAoA at high AoA (Ifrit: only with roll TVC, which the Revoker has none of).
# Setting type: Boolean
# Default value: true
SlipYawTvcAssist = true

## Revoker 0.1.0, default off: with the fin or rudder damaged, count the canards' yaw (differential drag) in the first yaw tier with the rudder and the yaw TVC. Off: the canards are still full pitch / roll / yaw effectors in the allocator, but their yaw is not counted as free reach (one canard at 40 deg makes ~45 deg/s^2 of yaw at a pitch and roll cost the allocator will not pay, so counting it kept the split-flaperon tier shut: bench, fins gone at 700 km/h, a pedal kick departed with nothing moving for 1.3 s).
# Setting type: Boolean
# Default value: false
CanardYawTier = false

## Absolute body roll-rate ceiling (deg/s). Below ~250 m/s IAS the original-aircraft schedule and RollAuthorityUse set the rate; above it this ceiling holds the rate flat.
# Setting type: Single
# Default value: 250
MaxRollRate = 250

## Body yaw-rate limit (deg/s). Revoker 0.2.2: 90 (was 75); bench, 70 deg loaded rolls 68-70 -> 75-80 deg/s velocity-vector roll at the same sideslip, corkscrews body yaw 64 -> 70 deg/s.
# Setting type: Single
# Default value: 90
MaxYawRate = 90

## Roll-rate ceiling vs the ORIGINAL aircraft's roll rate below ~120 m/s IAS (blends to the high-IAS gain by 170 m/s).
# Setting type: Single
# Default value: 1.2
RollRateGainLowIAS = 1.2

## Roll-rate ceiling vs the original aircraft's roll rate above ~170 m/s IAS.
# Setting type: Single
# Default value: 1.1
RollRateGainHighIAS = 1.1

## Fraction of the full roll authority (wings and stabilators) used to stop a roll, on top of roll damping. Before 1.8.26 this was a fraction of the wing-only authority.
# Setting type: Single
# Default value: 0.8
RollBrakeUse = 0.8

## Steady roll never needs more than this fraction of the available roll control moment (roll rate is given up instead of saturating the surfaces).
# Setting type: Single
# Default value: 1
RollAuthorityUse = 1

## Above this |AoA| the pedals blend into the stick's velocity-vector roll (full coupling 14 deg higher).
# Setting type: Single
# Default value: 36
CoupledAxisAoA = 36

## Sideslip commanded by full pedal below the coupling AoA (deg).
# Setting type: Single
# Default value: 15
PedalSideslip = 15

## Ceiling on the shaped velocity-vector roll acceleration (deg/s^2); below it the measured authority sets the rate.
# Setting type: Single
# Default value: 720
MaxRollAccel = 720

## Sideslip error (deg) above which the velocity-vector roll/yaw command is backed off, fading to zero command 10 deg above it. Raise it for manoeuvres that live at large sideslip on purpose (falling leaf); lower it for tighter coordination.
# Setting type: Single
# Default value: 4
SideslipGuardStart = 4

## How hard a yaw-saturated allocation backs the roll/yaw command off (0..1, fraction removed at full saturation). Lower = the command stays up when the surfaces cannot fully deliver it (more sideslip, more yaw rate); 0 = off.
# Setting type: Single
# Default value: 0.7
YawSaturationGuard = 0.7

## 2.1.5: the roll governor (1.8.41, keeps nozzle margin for pitch during rolls) looks at where the nozzle margin is heading 0.4 s ahead and eases the roll off early and in proportion, instead of cutting it once the nozzles are already pinned and restoring it a second later (the roll hitch). It comes back only when the margin is there and no longer falling. false = 2.1.4. Takes effect at once.
# Setting type: Boolean
# Default value: true
PredictiveRollGovernor = true

## 2.1.8: while the jet carries a velocity-vector roll, the AoA may only sweep as fast as the yaw and roll axes can re-point the rate vector to follow it (a roll at AoA a needs a yaw rate of p sin a; sweeping a under that roll turns the yaw rate already there into sideslip). Mainly a full push right after a high-AoA roll at low IAS. No effect with no roll, and none beyond the AoA limits (protection keeps its own rate). false = off (no AoA-sweep limit). Takes effect at once.
# Setting type: Boolean
# Default value: true
AoASweepYawLimit = true

## 2.2.7: positive-AoA pulls while rolling: the AoA rise is held to what the yaw can follow, and tapered to a hold as the sideslip (and where it is heading) approaches PullSideslipMargin, on the side the AoA rise drives it. Acts from ~10 deg/s of roll (full by 20). Pulls without roll and steady-AoA rolls are unaffected. Needs AoASweepYawLimit on. false = no positive-AoA limit (2.2.3). Takes effect at once.
# Setting type: Boolean
# Default value: true
AoASweepYawLimitPositive = true

## Revoker 0.2.13: default 15 -> 9 (dev files still at 15 moved once). Ifrit 0.3.1: default 15 (0.3.0: 9). Bench, corkscrew entry at 475 km/h: at 9 the governor held the AoA near 20 deg while the roll settled (the hitch). 2.2.7 (2.2.8: uses the full margin; 2.2.23: default 6 -> 9): sideslip (deg) the AoA-rise governor in a rolling pull runs up to. The AoA rises as fast as the yaw can follow, tapers from 70 % of the margin (2.2.7: 35 %) and holds at it; past it the AoA comes back down. Judged on the sideslip and where it is heading 0.3 s ahead. Allowed 2-15: lower = tighter sideslip, slower AoA build-up while rolling. Takes effect at once.
# Setting type: Single
# Default value: 9
PullSideslipMargin = 9

## 2.2.8 (2.2.23: default 0 -> 0.7; 2.2.26: 1; 2.2.27: back to 0.7): in a rolling pull held back by the sideslip governor, how much of the AoA rise you ask for is bought back by slowing the roll (the sideslip a rising AoA makes goes as roll rate x AoA rate). 0 = roll kept, AoA rise limited (2.2.7). 1 = roll slowed (to no less than 30 deg/s) until the asked AoA rise fits the sideslip margin; in between, the roll limit goes that share of the way. The roll comes back once the AoA rise is no longer limited. 2.2.11: above ~180-230 kt (2.2.12; 2.2.11: 230-280) the roll limit is also set ahead of time from the AoA rate the stick asks for, so the roll does not build past what the yaw can coordinate before the governor reacts. Takes effect at once.
# Setting type: Single
# Default value: 0.7
PullRollTrade = 0.7

## 2.2.24: in a rolling pull, the governor's yaw-authority feed-forward (how fast the AoA may rise for the roll in force) is scaled up to this many times while the sideslip stays under half of PullSideslipMargin and the stick asks for more, and scaled back as the sideslip passes 70 % of it; the sideslip taper still holds the margin. Off with a fin lost. 1 = off (2.2.23: the feed-forward alone held the AoA rise to ~10 deg/s at 100-125 kt with 1-4 deg of a 9 deg margin). Allowed 1-8. Takes effect at once.
# Setting type: Single
# Default value: 4
PullFFBoostMax = 4

## 2.2.9: rolling-pull governor without the yaw-lead release, and its pitch-rate cap comes back over ~0.3 s instead of at once. Removes most of the pitch bounce when pulling with lateral stick, but full aft + full roll together from wings level builds AoA more slowly (bench 450 km/h: 39 -> 21 deg at 4 s); PullRollTrade buys that back. false = 2.2.8 (faster AoA in pull + roll together, bouncier). Takes effect at once.
# Setting type: Boolean
# Default value: true
PullGovSmooth = true

## 2.2.7: decelerons. When the yaw needed is past what the rudders can give (both fins gone, one fin gone, or one engine out with the other's thrust more than the rudders hold), the inner and outer flaperons on one wing open against each other (their rolls cancel, their drag yaws the jet), up to SplitFlaperonYawUse of the drag yaw they have. Only the part the rudders cannot cover; the engine-out VMC throttle limit acts after it. false = 2.2.6 (yaw target limited to the rudders). Takes effect at once.
# Setting type: Boolean
# Default value: true
SplitFlaperonYaw = true

## 2.2.19: default 1 (was 0.7). Bench, both fins gone, full roll held at 25-40 deg AoA: worst sideslip mean 12.4 -> 10.8 deg, roll tracking unchanged. 2.2.7: share (0-1) of the flaperons' remaining drag yaw the deceleron split may ask for. Higher = more yaw, more roll and pitch disturbance from the split. Takes effect at once.
# Setting type: Single
# Default value: 1
SplitFlaperonYawUse = 1

## 2.2.8: how much of the deceleron split gives way to lateral stick (the split's reach shrinks by this x |lateral stick|, held 1 s after the stick returns). 0 = split kept through rolls (as 2.2.7; least sideslip). 1 = no split while rolling (roll tracks more evenly, but with both fins gone the sideslip in rolls runs much higher, e.g. 15 -> 27 deg replaying your 19 Oct 338-362 s inputs on the bench). Takes effect at once.
# Setting type: Single
# Default value: 0
SplitFlaperonRollYield = 0

## 2.1.9 (off by default, experimental): during a roll at 12-45 deg AoA, when the nozzles' nose-down margin is heading for the roll governor's threshold, the slats retract (they are wing area ahead of the CG, so out they push the nose up) to give the pitch axis nose-down moment before the governor has to slow the roll. Costs ~7 % of the lift while they are in (bench: 0.05-0.4 g less in the roll); they come back out when the margin returns or the roll ends. Bench gain is modest: peak roll rate +4..+28 deg/s in 20-30 deg AoA rolls with thrust, no change to the first second of the roll. false = 2.1.8. Takes effect at once.
# Setting type: Boolean
# Default value: false
SlatRollRelief = false

## 2.1.10: rolls at an AoA limit. (1) While the stick holds the jet within 4 deg of an AoA limit, the roll-rate limit that keeps the roll's inertial pitch-up within the nose-down authority stays on and eases off over 0.6 s; it used to follow the pitch error on and off every ~0.6 s, so the roll rate and the pitch rate bounced. (2) While a velocity-vector roll runs, the AoA-limit capture plans its braking with what is left for pitch less the roll's inertial pitch-up, so it no longer overshoots the limit, hits protection and drops back several degrees in a cycle. In fast rolls the AoA can sit 1-3 deg under the limit. false = 2.1.9. Takes effect at once.
# Setting type: Boolean
# Default value: true
CouplingLimitAtAoALimit = true

## 2.2.3: on by default (2.2.2: off). full aft + roll. The roll-rate limit that keeps the roll's inertial pitch-up within the nose-down authority stays on for the whole loaded roll (not only within 4 deg of the AoA limit), and the roll governor reads the nozzles' margin as it is instead of projecting it 0.3 s ahead. Both switched on and off every ~0.45 s in the 13 Oct 11:08 log (690 km/h pull + roll: roll target 98 <-> 172 deg/s, nozzles stop to stop, AoA 41..48). Bench: the pitch-rate and nozzle oscillation in the roll about halve; bank after 4 s 0-11 % lower. Only with CouplingLimitAtAoALimit on. Takes effect at once.
# Setting type: Boolean
# Default value: true
LoadedRollSteady = true

## 2.1.10: above ~20 deg AoA, while sideslip is building (from 2 deg, full by 8, counting where it is heading 0.3 s ahead), the control allocator stops trading roll accuracy for yaw (yaw weight 8 -> 2 at 40+ deg AoA): at high AoA a body roll that runs past its command makes sideslip as fast as a yaw-rate error does. No change while the sideslip is small. false = 2.1.9. Takes effect at once.
# Setting type: Boolean
# Default value: true
HighAoASideslipAllocation = true

## 2.1.3: rolls at the low-thrust AoA cap (36 deg at idle / low T-W). Within 4 deg of the cap the roll-coupling limit stays on instead of waiting for the AoA to rise, and the roll governor judges the nozzle margin only by the nozzles' share of the nose-down authority (pinned weak nozzles no longer read as no pitch reserve). Aimed at the hitches where the roll was cut and restored as the AoA overshot the cap. Only acts at the low-thrust cap. false = 2.1.2. Takes effect at once.
# Setting type: Boolean
# Default value: true
LowThrustCapRollFix = true

## Above 15-25 deg AoA the body yaw rate is capped at this x measured yaw authority (so the yaw can be stopped again). Higher = more responsive moderate-AoA rolls, more sideslip on stops.
# Setting type: Single
# Default value: 0.7
YawStopFactor = 0.7

## Roll command lead per unit of roll damping (s per 1/s above 2.5/s): cancels the roll loop's tracking lag at high dynamic pressure so roll stops end when the command does, without a slow tail. 0 = off.
# Setting type: Single
# Default value: 0.008
RollLagCompensation = 0.008

## Above 15-25 deg AoA, widens the yaw-rate cap (YawStopFactor x yaw authority, and its 20 deg/s floor) by this factor at very low IAS (falling leaf). It fades out along a curve above LowIasYawBoostFullIAS (see LowIasYawBoostFalloff). 1 = off.
# Setting type: Single
# Default value: 1.7
LowIasYawBoost = 1.7

## IAS (m/s) up to which the full LowIasYawBoost applies.
# Setting type: Single
# Default value: 70
LowIasYawBoostFullIAS = 70

## Above LowIasYawBoostFullIAS the extra margin decays exponentially with this IAS scale (m/s): 10 = ~50 % of it left at +7 m/s, ~10 % at +23 m/s, gone by 120 m/s.
# Setting type: Single
# Default value: 20
LowIasYawBoostFalloff = 20

## Roll-rate ceiling is also limited to this many seconds of the measured roll acceleration (the roll equivalent of YawStopFactor). Since roll acceleration is moment / inertia, this is what makes the roll-rate limit follow a heavy load, especially one far from the CG. 0 = off.
# Setting type: Single
# Default value: 1
RollStopFactor = 1

## Share of the roll authority planned for acceleration at and above ~110 m/s IAS (the rest is reserve for regulation against roll damping).
# Setting type: Single
# Default value: 0.5
RollAccelUse = 0.5

## Same at and below 60 m/s IAS, blending to RollAccelUse by 110. Roll damping is small down there and the surfaces are far from saturation, so more of the authority can go into the manoeuvre - this is what makes a low-speed reversal crisp.
# Setting type: Single
# Default value: 0.8
RollAccelUseLowIAS = 0.8

## Ifrit 0.3.1: AoA (deg) where HighAoALateralBrakeMargin (main cfg) starts to blend in.
# Setting type: Single
# Default value: 25
HighAoALateralMarginStart = 25

## Ifrit 0.3.1: AoA (deg) from which HighAoALateralBrakeMargin applies in full (smoothstep in between).
# Setting type: Single
# Default value: 30
HighAoALateralMarginFull = 30

## Flying backwards: the velocity-vector roll maps to body roll through cos(AoA), which flips sign past 90 deg, so the stick would roll the jet the other way from the pilot's seat. This flips the roll command with it, blended smoothly from ReversedFlowSenseStart to ReversedFlowSenseEnd (0.3.4; 0.3.2 flipped at once at 100 deg AoA, released at 80). Pitch and pedal are unaffected - the control loop already handles reversed flow on the surfaces themselves.
# Setting type: Boolean
# Default value: true
ReversedFlowRollSense = true

## 1.8.45: from 25 to 35 deg AoA up, the roll and yaw rate limits may not exceed what the stop-side authority (at the IAS predicted by DecelLookahead) brakes in the stop time of the reference manoeuvre, full pedal + full lateral stick at 65 deg AoA and 280 km/h (RollStopFactor for roll, YawStopFactor x the yaw boost at 280 km/h for yaw). Replaces there the fixed 30 deg/s roll and 20 x boost yaw floors, which outran the authority below ~65 m/s IAS. Costs yaw rate in slow post-stall yaw: bench, 65 deg AoA at 200 km/h 34 -> 23 deg/s, 300 km/h 37 -> 32. false = 1.8.44.
# Setting type: Boolean
# Default value: true
HighAoABrakeFloor = true

## 1.9.2: IAS (km/h) of the reference manoeuvre for the high-AoA yaw braking floor (HighAoABrakeFloor): full pedal + full lateral stick at max AoA. The yaw-rate limit may not exceed what the yaw authority brakes in YawStopFactor x the low-IAS yaw boost at this IAS (1.8.45: 280).
# Setting type: Single
# Default value: 270
YawBrakeRefIAS = 270

## 1.9.3: below this IAS (km/h) the allowed yaw stop time grows smoothly (smoothstep) to YawStopTimeLowIAS x at YawStopTimeFullIAS; flat above and below.
# Setting type: Single
# Default value: 210
YawStopTimeStartIAS = 210

## 1.9.3: IAS (km/h) at and below which the full YawStopTimeLowIAS applies.
# Setting type: Single
# Default value: 150
YawStopTimeFullIAS = 150

## 1.9.3: allowed yaw stop time at low IAS relative to the reference: 1.5 = 50 % more yaw rate for the same yaw authority (slower braking). 1 = flat. (1.9.2's YawBrakeMargin* keys worked the other way and are no longer read.)
# Setting type: Single
# Default value: 1.5
YawStopTimeLowIAS = 1.5

## Revoker 0.2.4: 1 (no mid-IAS band; the F-22E rudder rule cut the corkscrew entry yaw limit 77 -> 54 deg/s from 330 to 290 km/h). F-22E: 2.0.12: 0.75 (1.9.4-2.0.11: 0.8). high-AoA yaw stop time (so yaw-rate limit) factor between YawStopTimeMidLoIAS and YawStopTimeMidHiIAS: 0.8 = 20 % less yaw rate for the same authority, faster braking. Smoothstep ramps of YawStopTimeMidRamp km/h outside the band. 1 = off.
# Setting type: Single
# Default value: 1
YawStopTimeMidFactor = 1

## 2.0.12: 280 (1.9.4: 290). lower edge (km/h) of the mid-IAS yaw band (full factor from here up).
# Setting type: Single
# Default value: 280
YawStopTimeMidLoIAS = 280

## 2.0.12: 380 (1.9.4: 330). upper edge (km/h) of the mid-IAS yaw band (full factor up to here).
# Setting type: Single
# Default value: 380
YawStopTimeMidHiIAS = 380

## 1.9.4: width (km/h) of the smooth ramps outside the mid-IAS yaw band (250-280 and 380-410 by default).
# Setting type: Single
# Default value: 30
YawStopTimeMidRamp = 30

[4. Gains]

## Ifrit: allocator cost of split-flap use (drag). Bench: roll/yaw results unchanged from 1e-4 to 5e-3.
# Setting type: Single
# Default value: 0.001
SplitFlapCost = 0.001

## Ifrit 0.3.0, default OFF: on the bench any weight here makes the released-stick pitch hold sluggish (q -0.3 deg/s bleeding off over ~7 s in level flight at 400 km/h, the stabs held still), an interaction with the roll-fight cost. TvcNeutralHold for the differential (roll) nozzles. With the lateral stick and pedals centred, the roll on its command and the sideslip under 2 deg, the nozzles go back to symmetric and the wing surfaces hold the roll trim; any roll input, roll error or sideslip frees them at once. false = 0.2.2.
# Setting type: Boolean
# Default value: false
TvcRollNeutralHold = false

## Ifrit 0.3.0: cost weight of TvcRollNeutralHold.
# Setting type: Single
# Default value: 30
TvcRollNeutralWeight = 30

## Ifrit 0.3.1: 0.003 (was 5e-5). Allocator cost of differential (roll) nozzle deflection. At 5e-5 the roll TVC was nearly free, so on a pitch release the allocator could run the decelerons/ailerons unevenly and cancel their roll with the nozzles (one nozzle back to neutral before the other, 20 Oct 14:03 log; bench 330-420 km/h: up to 12 deg nozzle split, pitch-rate overshoot -3 deg/s). At 0.003: under 1 deg, overshoot -0.2; corkscrew and rolling-pull sideslip within 0.1-0.3 deg of before.
# Setting type: Single
# Default value: 0.003
RollTvcCost = 0.003

## Revoker 0.1.0: allocator cost of yaw nozzle deflection.
# Setting type: Single
# Default value: 0.0005
YawTvcCost = 0.0005

## Revoker 0.1.0: during rolls the roll-time nozzle budget (RollTvcBudget) keeps the nozzle within its band of NEUTRAL (F-22E: of the pitch-only trim) at every thrust (F-22E: open from T/W 0.7 to 1.1), so the canards cancel the roll's nose-up / nose-down and carry the pitch trim; the nozzle still goes past the band where the canards cannot (their stall band, AoA protection, AoA/G capture braking).
# Setting type: Boolean
# Default value: true
CanardPitchPriority = true

## Revoker 0.1.0: while the lateral stick and pedals are steady, the roll on its command and the sideslip under 2 deg (a held turn), the nozzle's yaw axis is drawn back to neutral over ~1 s and the rudder and canards carry the steady yaw; the nozzle still takes every change. Cost weight; 0 = off. The pitch axis has the same (TvcNeutralHold, canards carrying the steady pitch).
# Setting type: Single
# Default value: 300
YawTvcNeutralHold = 300

## Revoker 0.1.0: allocator cost of the symmetric (pitch) part of the flaperon pair (F-22E/Ifrit: 2).
# Setting type: Single
# Default value: 2
ElevonSymCost = 2

## Stability-axis yaw rate per degree of sideslip error (1/s).
# Setting type: Single
# Default value: 1.3
SideslipGain = 1.3

## Roll-rate loop bandwidth (1/s).
# Setting type: Single
# Default value: 6
RollRateGain = 6

## Pitch-rate loop bandwidth (1/s).
# Setting type: Single
# Default value: 5
PitchRateGain = 5

## Yaw-rate loop bandwidth (1/s).
# Setting type: Single
# Default value: 2.5
YawRateGain = 2.5

## How far the capture braking plan leans from the authority at the target AoA (0) toward what is available right now (1). Lower = earlier braking, less overshoot, slower AoA build; higher = faster AoA build, more overshoot below afterburner. 0.3 is the bench balance.
# Setting type: Single
# Default value: 0.3
AoACaptureBrakeBlend = 0.3

## AoA capture plans its braking with the nose-down authority it can count on at the TARGET AoA: the nozzles' full authority at the live thrust (so less below afterburner and much less at part throttle) plus the stabs' authority at the target AoA from the surface model (almost none past ~45 deg, where they stall). The approach follows sqrt(2 x 0.7 x that x distance), the same deceleration the pitch trajectory can deliver. false = pre-1.8.20.
# Setting type: Boolean
# Default value: true
AoACaptureThrustBrake = true

## Back-calculation anti-windup for the AoA and G integrators (1/s): whenever a limiter (AoA/G capture braking, AoA limit, pitch-rate budget) clips the pitch-rate command below what the AoA/G loop asks for, the integrator is pulled back toward the command at this rate. Without it the integrator winds up during every capture and then holds AoA about 0.2 deg above the command until it unwinds (several seconds). 0 = pre-1.8.20.
# Setting type: Single
# Default value: 4
AoAGAntiWindup = 4

## While you hold pitch stick AND lateral stick (roll or pedal) together, the pitch law builds pitch rate with the nozzles' authority plus only (1 - this x |lateral stick|) of the stabs' remaining authority, and the allocator's cost for symmetric (pitch) stab deflection rises with it, so the nozzles take the pitch and the stabs stay for roll/yaw. Braking toward the commanded AoA/G, the AoA/G limits and protection always use full authority. No lateral stick, or pitch stick released = unchanged. 0 = pre-1.8.19.
# Setting type: Single
# Default value: 0.7
LateralStabReserve = 0.7

## The allocator also tries moving each stabilator with the nozzles taking up its pitch change, and keeps the pair move when it lowers the total error. Without it, a stab parked on a stalled, flat part of its curve for pitch cannot be moved to where it makes roll, because moving it alone breaks pitch and moving the nozzles alone breaks it the other way. Lets the nozzles carry the pitch trim whenever they have room, freeing the stabs for roll/yaw. false = pre-1.8.18.
# Setting type: Boolean
# Default value: true
StabTvcPairedSearch = true

## When a stabilator has been driven deep past its stall (local AoA more than 10 deg past the peak) during roll/yaw at moderate AoA, move it to the attached-flow side of its lift peak instead (trailing edge up, where the lift curve is steep), hold it there, and re-allocate everything else around it, the nozzles taking up the pitch. Undone when the modelled pitch error would grow by more than StabBranchPitchTol. false = pre-1.8.21.
# Setting type: Boolean
# Default value: true
StabBranchSwitch = true

## While the nose is pitching up faster than the pitch law commands above ~15-25 deg AoA (an AoA run-away), or AoA protection is active: (1) the allocator keeps pitch priority instead of handing stalled stabs to roll/yaw, and (2) it models the nose-down a stab really loses when it is driven deep past its stall for roll/yaw (the monotone stab pitch model hides that loss). false = pre-1.8.23.
# Setting type: Boolean
# Default value: true
OvershootPitchPriority = true

## 2.1.7: G + pitch-rate law only. Extra pitch-rate command on stick movement, washed out over StickLeadTau: a quick small input moves the nose a little at once, like an AoA step, then the plain rate response takes over; a held stick gets none. 0 = off (default). Around 1 = noticeable crispness; much above 1.5 small inputs can feel twitchy. Takes effect at once.
# Setting type: Single
# Default value: 0
StickLeadGain = 0

## 2.1.7: wash-out time (s) of StickLeadGain. Longer = the extra nose movement lasts longer and is larger for the same gain.
# Setting type: Single
# Default value: 0.15
StickLeadTau = 0.15

## 2.2.5: pull + lateral stick (the stabs handed to the roll, the nozzles carrying the pitch). The pitch-rate loop reads the measured pitch rate this many seconds ahead along the measured pitch acceleration, scaled by the nozzles' share of the pitch authority and by how much of the stab reserve the lateral stick has taken, so the slow nozzles stop driving stop to stop and the pitch rate stops swinging about its command (the hitch with an AoA overshoot in a full pull with roll added mid-pull, worse at high IAS). Pulls only. 0 = off (2.2.3). Bench: 0.15 / 0.25 / 0.35 / 0.5 all helped; 0.25 had the least AoA overshoot. Takes effect at once.
# Setting type: Single
# Default value: 0.25
RollPitchLead = 0.25

## While AoA is building past 20-30 deg (or running away), cap the velocity-vector roll rate so the inertial pitch-up it causes, (Izz-Ixx)/Iyy * p * r, stays within this fraction of the nose-down authority the jet has at that AoA (aero + stabs + nozzles at live thrust). This is what let full-aft + full-roll pulls overshoot to 70-77 deg below afterburner. Held-AoA rolls are not affected. 0 = off (pre-1.8.23).
# Setting type: Single
# Default value: 0.5
CouplingRollLimit = 0.5

## Body AoA (deg) above which StabBranchSwitch is not used. Above ~44 deg the stalled side of the stab is the better one for roll/yaw.
# Setting type: Single
# Default value: 42
StabBranchMaxAoA = 42

## Local AoA (deg) StabBranchSwitch moves the stab to, on the attached side of its lift peak.
# Setting type: Single
# Default value: 20
StabBranchTarget = 20

## Largest growth in modelled pitch-acceleration error (deg/s^2) StabBranchSwitch accepts. Protects AoA holding when the nozzles cannot take up the stab's pitch.
# Setting type: Single
# Default value: 5
StabBranchPitchTol = 5

## AoA command: deg/s of pitch rate per deg of AoA error.
# Setting type: Single
# Default value: 5
AoAGain = 5

## AoA command integral gain (1/s) near the target.
# Setting type: Single
# Default value: 3
AoAIntegral = 3

## Allocator weight of the yaw axis relative to roll below ~20 deg AoA. Higher = rudders keep the roll coordinated even when their roll side-effect costs some roll acceleration.
# Setting type: Single
# Default value: 8
YawAxisPriority = 8

## Fraction of the yaw-rate command's rate of change fed forward to the yaw loop at low AoA below 200 m/s IAS (blends to 1.0 by 300 m/s IAS, and by 28 deg AoA, where the body yaw is the velocity-vector roll). Lower = calmer rudders at low speed, slightly more sideslip.
# Setting type: Single
# Default value: 0.5
YawRateFeedForward = 0.5

## Allocator cost of moving the TVC nozzles. 2e-5 = nozzles take pitch changes first; ~0.02 = stabs do the quick pitch changes and the nozzles slowly take over the sustained (trim) share. Post-stall the nozzles are always fast.
# Setting type: Single
# Default value: 2E-05
TvcMoveCost = 2E-05

## 2.2.14: while the pitch rate is held steady (no change of pitch-rate command, no pitch error, no roll in progress) the nozzles are drawn back to neutral over ~1 s and the stabs carry the steady pitch moment; the nozzles still take every change. Cost weight: 1000 (default); 0 = off (2.2.13). Takes effect at once.
# Setting type: Single
# Default value: 1000
TvcNeutralHold = 1000

## 0.4.3 (the F-22E's 2.3.0/2.3.1 settled stall window): with the lateral stick and pedals centred and the lateral rates settled (under SettledRateOn deg/s, off again above SettledRateOff or with lateral input), the stabilators and rudders may not rest past the smaller of (lift peak - SettledStallMargin) and the foil's lift-slope knee (SettledSlopeFrac) of local AoA, at any AoA where such a range exists. This jet's stabilator foil has no stall before 45 deg (its lift keeps rising from 20 to 45 deg at a fifth of the linear slope, the drag four times), so a stab parked out there had next to no gradient for the allocator and made its maximum lift: 23 Oct 00:51 log, left stab on its stop for 10 s after a push through zero AoA at 58 m/s, the nozzle and the crossed wing against it. 0.4.2 and earlier only acted below 30 deg AoA and allowed the peak itself. false = off. Takes effect at once.
# Setting type: Boolean
# Default value: true
StabParkEscape = true

## 0.4.3: how far below the lift peak (deg of local AoA) the settled stall window keeps the stabilators and rudders (see StabParkEscape); the foil's slope knee applies where it is lower. Larger = further onto the attached slope, less trim deflection available from them. Takes effect at once.
# Setting type: Single
# Default value: 6
SettledStallMargin = 6

## 0.4.3: the settled stall window's limit is also where the foil's lift slope has fallen to this fraction of its steepest (the knee of a plateau foil: 26 deg on the stabilator foil at 0.15, where the slope is 0.66 /rad against 4.4 at zero; 0.25 = 17 deg, 0.1 = 31 deg). 0 = the peak - SettledStallMargin only. Takes effect at once.
# Setting type: Single
# Default value: 0.15
SettledSlopeFrac = 0.15

## 0.4.3: the settled stall window (StabParkEscape) comes on when the body roll and yaw rates are both under this (deg/s). Takes effect at once.
# Setting type: Single
# Default value: 10
SettledRateOn = 10

## 0.4.3: the settled stall window is held off while the thrust yaw (an engine out or down on thrust) uses more than this fraction of the fins' yaw authority at the present AoA (|asymAy| / asymCy, filtered 0.5 s, back on under this - 0.1): this jet has no rudders, and with an engine out a stabilator run out past its lift knee is its drag rudder (bench, engine-out pull at 250 km/h: windowed, the yaw saturated and the VMC cut the throttle). The 00:51 log's parked set had 0.29; the engine-out trims run 0.5-1.3. Takes effect at once.
# Setting type: Single
# Default value: 0.4
SettledYawUse = 0.4

## 0.4.3: the settled stall window goes off again above this body roll / yaw rate (deg/s), or with lateral input. Takes effect at once.
# Setting type: Single
# Default value: 20
SettledRateOff = 20

## 0.4.3: deg/s at which the settled window walks a surface resting past it back in (the window's edge moves, the allocator re-solves around each step). Takes effect at once.
# Setting type: Single
# Default value: 30
SettledWalkRate = 30

## 2.2.16: the roll-fight cost (RollFightCost) also acts while the lateral stick is centred, not only with the pedals in. With the stick released, a crossed set of surfaces - one stab split against the flaperons, ailerons and rudders, all near their stops, their roll cancelling - could hold for 10-15 s (19 Oct 18:05 / 18:32 logs, TVC off). false = 2.2.15. Takes effect at once.
# Setting type: Boolean
# Default value: true
RollFightReleased = true

## 1.8.42: while you roll, a stabilator pitching the nose up (trailing edge up) while the nozzles pitch it down to cancel costs the allocator this x its pitch acceleration squared (rad/s^2), so it rolls with less stab trailing-edge up and the nozzles keep their nose-down travel instead of the roll rate. Near the stabs' roll reversal (the trailing-edge-down stab stalled) one stab went fully trailing-edge up with the other near neutral and the nozzles pinned nose-down. Only that pattern counts (stabs nose-down with nozzles nose-up, the roll-pitch-priority trim, is left alone); off while the pitch-rate command is moving, while the nose comes up faster than commanded, in AoA protection and on AoA run-away. Bench vs 1.8.41: reversals at 19 deg AoA / 300 km/h nozzle min -20 -> -13, AoA over 1.2 -> 0.5 deg; roll stop at 200 km/h -14 -> -10; 2.5 t store at 600 km/h -20 -> -12, over 2.9 -> 0.9; at 26 deg a stab past 35 deg local AoA 32 % -> 0 % of the roll. Costs: reversal at 13 deg / 600 km/h over 3.9 -> 8.3 deg, 10 deg / 300 km/h 1.1 -> 2.7; bank at 1 s at 19-22 deg AoA 42 -> 36 and 28 -> 20 deg. 0 = off (1.8.41).
# Setting type: Single
# Default value: 1
RollPitchFightCost = 1

## 1.8.31: default 0 (the handover kept both stabs trailing-edge down for whole roll cycles and bounced the nozzles in roll spam; with ±20 deg the nozzles now take the roll trim). Low-AoA rolls with no pitch command: the stabs take over the roll surfaces' pitch-moment change so the TVC stays near its pre-roll trim. Below ~150 m/s IAS the nozzles still catch the fast part and hand the sustained part to the stabs as far as the stabs have travel to spare; above it the nozzles simply hold still. 1 = full, 0 = off (nozzles trim the roll alone, 1.7.0 behaviour).
# Setting type: Single
# Default value: 0
RollNozzleHold = 0

## 1.8.37: with an asymmetric load (lateral CG offset above ~8 cm) the asymmetric-load AoA cap is also held below the AoA where the jet runs out of nose-down authority - full nose-down stabs plus the nozzles at the thrust you have - minus this margin (deg/s^2), less 2 deg. On Aryx's airframe that point is only ~18-19 deg AoA at idle (the stabs stall trailing-edge down), so at idle the old cap (up to ~21 deg) sat right on the edge and any overshoot pitched up into a departure. Throttle up and the nozzles raise it again. Never below 10 deg. 0 = off (1.8.36).
# Setting type: Single
# Default value: 20
AsymPitchMargin = 20

## 1.8.37: with an asymmetric load, the roll-coupling limit (CouplingRollLimit) also works at a held AoA, not just while AoA is building past 12-22 deg, and pitch gets priority over roll as soon as AoA overshoots the asymmetric-load cap. Rolling toward the heavy wing at 12-20 deg AoA and idle used to reach 100-160 deg/s and then pitch up past the cap it could not stop in. Clean jets are unaffected. false = 1.8.36.
# Setting type: Boolean
# Default value: true
AsymRollCoupling = true

## 1.8.40: while you roll (below ~18-26 deg AoA), the nozzles stay within RollTvcBudget of their pre-roll trim and the pitch moment the roll makes is taken by the stabilators, with roll rate given up where they cannot. The allocation is re-solved with the flaperons' true pitch moment and the stabs kept on the attached side of their lift peak (past it the down-going stab turns nose-down into pitch-up), pitch and yaw weighted 10x over roll. Accepted only if the modelled pitch error stays within 4 deg/s^2 of what free nozzles would give; otherwise the band widens (x3, x8) or the normal allocation is kept. The nozzles are let go in AoA protection / overshoot past the AoA or asymmetric-load limit and briefly on roll stops and reversals. Bench cost: up to ~20 % roll rate at 15-20 deg AoA, ~35 % in a 1 g roll at 250 km/h (19 deg AoA); none above ~350 km/h at 1 g. RollTvcBudget sets the band: raise it to trade nozzle travel back for roll rate. false = 1.8.39.
# Setting type: Boolean
# Default value: true
RollPitchPriority = true

## 1.8.41: while the pedals are in (and 1 s after), the allocator may not split the horizontal surfaces against each other: a group (stabilators, outboard flaperons, inboard flaperons) whose roll opposes the net roll of the others costs this x its roll acceleration squared. With full pedal the rudders reach their stops and the allocator used to buy a few deg/s^2 of yaw from the flaperons' drag by rolling them one way and the stabs the other (roll cancelled) - the large, reversing stab/flaperon deflections on pedal inputs, and all of the yaw once the vertical tails are shot off. Rolls without pedal are allocated exactly as in 1.8.40. Bench, full pedal at 340 km/h: stab-vs-flaperon roll fight mean 24 -> 4 deg/s^2; tails shot off: 79 -> 9. 0 = off (1.8.40).
# Setting type: Single
# Default value: 5
RollFightCost = 5

## 1.8.41: while you roll, the roll-rate limit and roll-entry acceleration yield when the TVC nozzles have less than this fraction of their nose-down travel (nose-up at negative AoA) left at the live thrust, and come back as the margin returns. Above the RollPitchPriority band (18-26 deg AoA) the stabs lose nose-down authority when they roll (the down-going stab stalls) and the nozzles carry the roll's pitch-up alone: they sat on the -20 deg stop for whole rolls at 22-32 deg AoA, with or without a store. Bench, full roll at 26 deg AoA, AB, 450 km/h: nozzles on the stop 85 % -> 26 % of the roll, bank at 2 s 110 -> 87 deg; with an 800 kg store at the 22 deg cap: 35 % -> 18 %, 87 -> 77 deg. No change below ~18 deg AoA. Higher = more nozzle margin, less roll rate. 0 = off (1.8.40).
# Setting type: Single
# Default value: 0.15
RollPitchReserve = 0.15

## 1.8.34: 1.5 (1.8.33: 2, 1.8.32: 4). While you roll or yaw, the TVC nozzles stay within this many degrees of where they were before the lateral input (the pitch trim for your own pitch command), and the stabilators take the pitch moment the roll itself makes (mostly the flaperons' lift change). It is an allocator cost, not a clamp: if the stabs cannot supply it (on a stop), the nozzles still go further. The limit opens up to full nozzle travel between 14 and 20 deg AoA (the down-going stab is then near its stall and nose-down from it costs roll rate), between T/W 0.7 and 1.1 (with afterburner the roll trim is only a few degrees and the nozzles stay the fast pitch effector), in AoA protection / run-away and while the pitch-rate command is moving. Cost on the bench: 3-10 % roll rate in 300-350 km/h part-throttle roll spam, about 1 % bank at 1 s in single rolls. 0 = off (1.8.31: the nozzles take the whole roll trim, down to -20 deg at part throttle).
# Setting type: Single
# Default value: 1.5
RollTvcBudget = 1.5

## 1.8.34: 8 (1.8.33: 6, 1.8.32: 2). Allocator cost per (degree / 10)^2 of nozzle travel beyond RollTvcBudget. Higher = a harder budget.
# Setting type: Single
# Default value: 8
RollTvcBudgetCost = 8

## Time constant (s) separating 'fast' (nozzles) from 'sustained' (stabs) in RollNozzleHold. Lower = the stabs take over sooner.
# Setting type: Single
# Default value: 0.4
RollNozzleWashout = 0.4

## Allocator cost of differential (roll) stabilator use at attached flow. Lower = stabs do more of the roll.
# Setting type: Single
# Default value: 0.0005
StabilatorRollCost = 0.0005

## Share of the differential-stab roll moment counted as usable roll authority (sets roll rate ceiling / acceleration).
# Setting type: Single
# Default value: 0.55
StabilatorRollShare = 0.55

## High-speed pitch pacing: pitch-rate command acceleration <= this / lift slope (g per deg). Lower = gentler at high dynamic pressure.
# Setting type: Single
# Default value: 150
PitchOnsetLimit = 150

## Corrects the pitch target by the pitch moment the roll surfaces are about to make (their pitch side-effect is not in the allocator's model), so the stabilators and nozzles move with a roll instead of chasing it afterwards. Mostly visible at low IAS, where the nozzles are the fast pitch effector and the chase shows as nozzle twitch in rolls. 0 = off (pre-1.7.12 behaviour).
# Setting type: Single
# Default value: 1
RollPitchFeedForward = 1

## Scales the allocator's regularisation (neutral preference, move cost, pair costs) with dynamic pressure squared, capped at the high-speed value. The cost's error term grows with q^2 and the regularisation did not, so below ~150 m/s the surfaces were held near neutral and near their last position: weak roll and sluggish reversals at low IAS. 0 = pre-1.8.0 behaviour.
# Setting type: Single
# Default value: 1
LowQAllocatorRelief = 1

## Ceiling on the roll->pitch feed-forward, in deg/s^2 of pitch acceleration. It is an anticipation rather than a measurement, and at high dynamic pressure the roll surfaces' pitch moment is large enough that an error in it moves real g.
# Setting type: Single
# Default value: 30
RollPitchFeedForwardMax = 30

## During the feed-forward pass, symmetric (pitch) stabilator deflection costs this much more, so the correction lands on the nozzles instead of showing up as a large mean stabilator deflection under the roll's differential. 1 = no preference.
# Setting type: Single
# Default value: 1
RollPitchFeedForwardStabCost = 1

## RollPitchFeedForward fades out over the 15 deg below this |AoA| and is off above it: post-stall the stabilators have no pitch authority to redistribute and the pass would only compete for the surfaces holding the jet in yaw.
# Setting type: Single
# Default value: 35
RollPitchFeedForwardMaxAoA = 35

## Feed-forward of the gyroscopic roll/pitch/yaw coupling (w x Iw) between commanded and present rates. 0 = off (default since 1.8.14: evaluated at the commanded rates it arrives as a nose-down step the instant you roll, before the jet has the rates; the INDI loop already measures the real coupling).
# Setting type: Single
# Default value: 0
InertialCouplingFF = 0

## Stick released (zero-rate hold): when the pitch rate starts to leave the hold, the allocator weights pitch this many times harder against roll/yaw for the stabilators, so a roll cannot pull them into a nose-down shove. Scales in with the pitch-rate error (1 to 9 deg/s) and out with stick (fully off from 18% stick) and with stabilator stall. 1 = off (pre-1.8.14).
# Setting type: Single
# Default value: 30
ReleasedStickPitchPriority = 30

## Stick released: each allocation may only ask the stabilators for what their servos reach in this many seconds, so the nozzles and wing surfaces are never placed against a stabilator position that is still a third of a second away. Relaxes with stick and stabilator stall. 0 = off (pre-1.8.14).
# Setting type: Single
# Default value: 0.1
ReleasedStickStabRateBound = 0.1

## RollNozzleHold hands the nozzles' pitch trim to the stabs during rolls. While a stab is on its stop that handover is blocked and builds up; this caps how fast it is then applied (deg of nozzle per second), so it cannot all land in one frame the moment the stabs come off the stop - which is when they are braking the roll. 0 = uncapped (pre-1.8.15).
# Setting type: Single
# Default value: 5
RollNozzleWashoutSlew = 5

## 1.8.31: 0.035 (was 0.07; with any control delay 0.07 rang for 1-2 s after a pitch stop). Stick released, zero-rate hold established: the INDI pitch loop leads its measured effector moment by this many seconds of its own rate of change, covering the servo/filter lag when the trim moment is ramping (AoA bleeding off after a hard pull). Fades in over 0.2 s; off with stick, while the pitch-rate command is moving, in AoA protection and with stab stall. 0 = off (pre-1.8.16). Above ~0.1 s it starts to wobble.
# Setting type: Single
# Default value: 0.035
ReleasedStickMomentLead = 0.035

## Revoker 0.1.0: 0.0002 (F-22E/Ifrit 0.004): the canards carry the steady pitch (held turns, rolls) and the nozzle the transients. Allocator cost of symmetric (pitch) stabilator deflection relative to the nozzles. Higher = steady trim / sustained pitch rate carried by TVC, stabs kept for transients and whatever TVC cannot hold.
# Setting type: Single
# Default value: 0.0002
StabilatorTrimCost = 0.0002

## Easing the stick: pitch-rate deceleration (deg/s^2) toward the rate the aircraft will sustain at the new AoA/G. Lower = smoother.
# Setting type: Single
# Default value: 20
UnloadDecel = 20

## Easing the stick: if AoA still rises during the decel, the pitch-rate target drops by this x AoA rate (to zero at most).
# Setting type: Single
# Default value: 1.5
UnloadRiseGain = 1.5

## Easing out of a hard pull at high dynamic pressure, the pitch rate is bounded so the load is captured at the commanded G instead of continuing past it into negative g - the same kinematic capture the load limiter uses, applied from above the target. Lower = a softer bound (0.5 allows twice the nose-down rate); 0 = off (pre-1.8.10 behaviour). Only in the G-command regime.
# Setting type: Single
# Default value: 1
GUndershootCapture = 1

## G command bandwidth (1/s): load error is converted to AoA error through the live lift slope.
# Setting type: Single
# Default value: 2.5
GGain = 2.5

## G command integral gain (1/s^2), removes steady load error.
# Setting type: Single
# Default value: 1
GIntegral = 1

## 1.9.0: AoA/G command pre-filter. The AoA and G commands are shaped before the loop: a small request (a few degrees or a fraction of a g from where the jet is) builds up gently, a large one runs as before. The shaping speed (1/s) grows with the step from ShapingAoAGainSmall to ShapingAoAGainLarge over ShapingAoASpan (G: ShapingG*), and small steps also ramp their onset over ShapingOnset. The same idea as the self-adjusting pre-filter gain of the T-50 control law (60 % gain below 1 g of error, 100 % above 3 g). false = 1.8.45.
# Setting type: Boolean
# Default value: true
CommandShaping = true

## 1.9.0: AoA step (deg) from which the AoA command is no longer slowed.
# Setting type: Single
# Default value: 15
ShapingAoASpan = 15

## 1.9.0: shaping speed (1/s) of the AoA command for a very small step. Lower = gentler fine tracking.
# Setting type: Single
# Default value: 1.5
ShapingAoAGainSmall = 1.5

## 1.9.0: shaping speed (1/s) of the AoA command at and above ShapingAoASpan (fast enough to be transparent).
# Setting type: Single
# Default value: 10
ShapingAoAGainLarge = 10

## 1.9.0: onset time (s) of a very small AoA/G step (the command's rate builds up over this); fades to 0.03 s at the span.
# Setting type: Single
# Default value: 0.25
ShapingOnset = 0.25

## 1.9.0: load step (g) from which the G command is no longer slowed.
# Setting type: Single
# Default value: 3
ShapingGSpan = 3

## 1.9.0: shaping speed (1/s) of the G command for a very small step (onset and unload).
# Setting type: Single
# Default value: 1.5
ShapingGGainSmall = 1.5

## 1.9.0: shaping speed (1/s) of the G command at and above ShapingGSpan.
# Setting type: Single
# Default value: 10
ShapingGGainLarge = 10

## 1.9.0: pitch-loop lag compensation. The incremental (INDI) pitch loop estimates the airframe's own moment from filtered sensors; at high dynamic pressure that moment moves fast with AoA and pitch rate and the filter lag made the pitch rate overshoot (bench, 2 g command at 1300 km/h: 2.8 g peak then 1.8 g, a slow G oscillation). The lag is now predicted from the airframe model (moment slope with AoA and pitch rate x the filter lag). 0 = off (1.8.45).
# Setting type: Single
# Default value: 1
HybridIndi = 1

## 0.4.9 (from F-22E 2.4.7/2.4.8): disturbance-rate lead, seconds. Above 25-40 deg AoA with the pitch stick released, the pitch loop takes the airframe's own pitch acceleration (what the effectors are not doing) forward by its rate x this, so a steady fall in it as the AoA unwinds after a corkscrew release is met when it arrives instead of ~0.1 s late. Pitch damping is left out. Fades out with T/W 0.4 -> 0.2 (the horizon is the nozzles' response). 0 = off (0.4.8).
# Setting type: Single
# Default value: 0.15
HybridIndiHighAoALead = 0.15

## 0.4.9 (from F-22E 2.4.7/2.4.8): with the pitch stick released and T/W at least 0.25, the allocator's last pass also tries a local Newton step for the nozzles, not only their grid points (every 4 deg). Without it the nozzles could sit between two grid points with a pitch miss while the joint steps were rejected (stabs stalled on their stops, large yaw miss): the post-corkscrew nose dip. false = 0.4.8.
# Setting type: Boolean
# Default value: true
AllocNozzleNewton = true

[5. Airframe]

## Ifrit 0.4.1: throttle response (Ifrit 0.4.5: back to the game's own, 1) for every variant (Stock included): the engines' spool rate (RPM per second toward the throttle's target) and the afterburner's light-up / fade speed are multiplied by this at the airframe setup. 1 = the mod's own values.
# Setting type: Single
# Default value: 1
ThrottleResponseScale = 1

## Revoker 0.2.20 (0.2.22: knee-preserving): staggered stall of the two trailing-edge elevon pairs. Both use the wing foil (Fighter1_wing: lift knee 17 deg, peak 44.6 deg local AoA), so without this both reverse for velocity-vector roll at ~45 deg together. Each pair gets its own copy of the curve with the peak moved to InnerElevonReversalAoA / OuterElevonReversalAoA (both signs); the game's aero (the parts' charts) and the FCS's models use the same curves. The inboard pair's camber share on wing2 is applied as a force on that curve, so it reverses with the elevon (wing2's own clean lift keeps the wing curve). Takes effect on the next spawn. false = 0.2.19.
# Setting type: Boolean
# Default value: true
ElevonStallStagger = true

## Revoker 0.2.22: 26 (0.2.21: 37, 0.2.20: 32; migrated once). Inboard elevon (flap_L/R) lift-peak local AoA (deg, 20-80) with ElevonStallStagger. 0.2.22 moves only the plateau above the wing foil's 17.2 deg knee (the curve below it and the 1.10 peak CL are untouched). Model, outboard at 45, both pairs + camber, measured arms: 26 maximises the worst-case velocity-vector roll authority over 10-55 deg (0.26 small / 0.18 full deflection, vs 0.03 / 0.01 unstaggered); the inboard pair reverses at ~27.7 (33.2 at full deflection) and is flown reversed from there. Next spawn.
# Setting type: Single
# Default value: 26
InnerElevonReversalAoA = 26

## Revoker 0.2.20: outboard elevon (aileron_L/R) lift-peak local AoA (deg) with ElevonStallStagger. 45 = the wing foil's own (44.6). Next spawn.
# Setting type: Single
# Default value: 45
OuterElevonReversalAoA = 45

## Revoker 0.2.0: the inboard elevon (flap_L/R) also cambers the wing2 section ahead of it: wing2's lift normal turns by K x the flap deflection (the stock HLD turns it 4 deg for 25, K 0.16). Thin-airfoil effectiveness of the 0.24-chord flap (1.2 of 4.9 m) is 0.60; host share (0.60 x 5.2 - 1.4) / 3.8 = 0.46. 0 = off.
# Setting type: Single
# Default value: 0.46
FlapCamberCoupling = 0.46

## Revoker 0.1.0: the outboard elevon (aileron_L/R) also cambers the wingtip section ahead of it: the wingtip's lift normal turns by K x the deflection. Thin-airfoil effectiveness of the 0.30-chord surface (1.02 of 3.41 m) is 0.66; host share (0.66 x 5.25 - 2.0) / 3.25 = 0.45. 0 = off.
# Setting type: Single
# Default value: 0.45
AileronCamberCoupling = 0.45

## Ifrit 0.3.0: the decelerons (inner) and ailerons (outer) work as flaperons on the F-22E flap schedule: up to 23 deg (inner) and OuterFlaperonDroop x that (outer) TE-down with AoA, load and speed (the high-lift schedule), held off the stall on each surface's own flow, out of the way of full roll stick, faded out from 20 to 30 deg AoA. false = 0.2.2 (no droop).
# Setting type: Boolean
# Default value: true
IfritFlaperons = true

## Ifrit 0.3.6: the stock high-lift device also rotates each deceleron's inner hinge 20 deg TE-down (the hinge carrying the deceleron's lift and both split halves), on top of the FCS deflection and the split: a split half reached 50 deg on the runway with the airbrake out (80 worst case). With this on, that hinge stays put and the decelerons fly the same 20 deg x deploy as droop instead, so everything stays inside the +-30 deg deceleron travel and the split budget. The airbrake has priority over that droop (it retracts while the splits are out). false = 0.3.5.
# Setting type: Boolean
# Default value: true
DeceleronHldFold = true

## Revoker 0.2.0: the inboard trailing-edge surfaces (flap_L/R; in the game moved only by the high-lift device, 25 deg TE-down below 90-150 m/s) are inboard elevons: allocator effectors for pitch and lateral (the inboard pair, roll group 3, so they can also cross the ailerons for drag yaw as split elevons), driven at SurfaceServoSpeed. The FCS drives the hinge and turns the wing2 section's lift normal by FlapCamberCoupling x the deflection. No flap schedule (FlapHighLiftDroop 0). false = HLD flaps as stock.
# Setting type: Boolean
# Default value: true
FlapFlaperons = true

## Revoker 0.2.0: travel each way of the inboard elevons (deg). The stock HLD goes 25 TE-down.
# Setting type: Single
# Default value: 25
FlapHingeRange = 25

## Revoker 0.2.0: default 0. TE-down droop (deg) the inboard elevons are drawn toward at full HLD deployment (the game's low-speed flap schedule: out below 90 m/s, in above 150). A canard-delta's trailing edges are elevons with no flap schedule (unlike the F-22E / Ifrit flaperons), so 0 = no droop: the allocator alone sets them.
# Setting type: Single
# Default value: 0
FlapHighLiftDroop = 0

## Revoker 0.1.0: off (F-22E/Ifrit: on). The flap schedule's high-g term that turns the trailing-edge flaperons up to 9.6 deg TE-up from 3 to 9 g below 16-24 deg AoA. Off, the trailing edges stay at neutral in a held turn and the canards carry the pitch.
# Setting type: Boolean
# Default value: false
FlaperonLoadRelief = false

## Revoker 0.2.3: draw the trailing-edge surfaces turning about their modelled hinge lines (render only; aero unchanged). Off: the game's own visuals.
# Setting type: Boolean
# Default value: true
VisualHingeFix = true

## Revoker 0.2.1: on the ground, the share of each trailing-edge elevon's travel the pitch stick moves (0-1; full aft = TE up). In the air the allocator uses them for pitch (ElevonPitch).
# Setting type: Single
# Default value: 1
GroundElevonPitch = 1

## Revoker 0.2.0: default on. The ailerons (outboard elevons) are pitch effectors as well as roll, with their true pitch moment in the allocator; the inboard elevons (FlapFlaperons) always are. false = ailerons for roll/yaw only, pitch from canards + TVC + inboard elevons.
# Setting type: Boolean
# Default value: true
ElevonPitch = true

## Actuator smoothing (s): time for a servo command to accelerate to full servo speed (and brake into its target on a matching curve). Servo speed is unchanged and a steady slew runs at full speed. 0 = off.
# Setting type: Single
# Default value: 0.06
ActuatorDamping = 0.06

## AoA (deg) at which the slats start coming down. The high-lift device has no aero model beyond the wing area it adds, and the stock AoA term is a step rather than a schedule, so the FCS drives it off AoA directly.
# Setting type: Single
# Default value: 2
SlatAoAStart = 2

## AoA (deg) at which the slats are fully down. They then stay down to HighLiftMaxAoA.
# Setting type: Single
# Default value: 20
SlatAoAFull = 20

## The slats (high-lift device) stay deployed up to this |AoA|, fading over the 10 deg below it. They used to be tied to the flaperon's trailing-edge-down schedule and so retracted by 30 deg AoA. The device's mechanical TE-down swing is subtracted by the flap drive, so the net flaperon bias is unchanged: only the slats and the wing area they add stay out.
# Setting type: Single
# Default value: 70
HighLiftMaxAoA = 70

## How much of the slat deployment is kept at high AoA (0..1). 0 = pre-1.8.0 behaviour (slats retract with the flap schedule).
# Setting type: Single
# Default value: 1
HighLiftHighAoAShare = 1

## Revoker 0.1.0: 0 (F-22E/Ifrit 0.6). How far the trailing-edge flaperons droop TE-down with the flap schedule (fraction of the inboard flap angle, stall-capped, roll-biased). 0 = the trailing edges stay at neutral except for roll, and the canards carry a held turn's pitch (with the nozzle drawn to neutral by TvcNeutralHold).
# Setting type: Single
# Default value: 0
OuterFlaperonDroop = 0

## Servo speed multiplier for every control surface and the TVC nozzles (Aryx's servos run at 70 deg/s; 1.428571 = 100 deg/s).
# Setting type: Single
# Default value: 1
ActuatorSpeedScale = 1

## Revoker 0.2.19: 60 (0.2.17-0.2.18: 70; 0.2.16: 80; 0.2.7-0.2.15: 45; stock 40; migrated once). Canard travel, trailing edge up = leading edge down (deg, up to 80). The + side of the canard telemetry (canL / canR): at +45..70 deg AoA a +40 deg canard sits at ~+8 deg local AoA. On the runway full push and the rollout brake each go to this stop. 0 = the stock travel.
# Setting type: Single
# Default value: 60
StabilatorRangeTEUp = 60

## Revoker 0.2.7: 45 (stock 40; 0.2.14-0.2.15 had 80 here, the wrong side). Canard travel, trailing edge down = leading edge up (deg, up to 80): the - side of the canard telemetry, the side the canards sit on in a push (at -45..-56 deg AoA a -40 deg canard sits at ~-14 deg local AoA). AoALimitNegative 55 was set with this at 45 (stock 40: -50). 0 = the stock travel.
# Setting type: Single
# Default value: 45
StabilatorRangeTEDown = 45

## Ifrit 0.3.0: travel each way for the ailerons (outer) and decelerons (inner) (deg). Stock: ailerons 30, decelerons 20. 0 = stock.
# Setting type: Single
# Default value: 30
FlaperonRange = 30

## Ifrit 0.3.0: servo speed of every control surface (deg/s), the F-22E FCS's 100. Stock: stabilators 60, ailerons 45, decelerons 70. 0 = the stock speeds x ActuatorSpeedScale. TVC: TvcSlewRate.
# Setting type: Single
# Default value: 100
SurfaceServoSpeed = 100

## Ifrit 0.3.0: deceleron split limit (deg), for the airbrake and for split yaw. 0 = the decelerons' own travel (FlaperonRange, 30); the stock limit is 25. Split drag is split x splitDrag x rho x v^2, so 30 is 20 % more than 25.
# Setting type: Single
# Default value: 0
SplitRange = 0

## Pitch thrust-vectoring travel each way (deg, game maximum 20). 0 = Aryx's original (10).
# Setting type: Single
# Default value: 0
TvcPitchRange = 0

## TVC nozzle slew rate (deg/s). 0 = follow ActuatorSpeedScale like the control surfaces (70 x scale).
# Setting type: Single
# Default value: 70
TvcSlewRate = 70

## 2.0.11: default 90 (off, 2.0.8 behaviour). 2.0.10: below 40 deg body AoA a stab is not commanded more than this many degrees past its lift peak (local AoA, either sign); the limit opens up from 40 to 50 deg AoA (deep-stall use above, e.g. falling leaf, unchanged). Stops the stabs swinging through deep stall in rolls at 36 deg and parking past the peak after a roll (10:00 flight). Bench, full roll at 36 deg with TVC off: stab rate 40 -> 16 deg/s rms, roll rate 27-33 -> 19-25 deg/s; with TVC on the roll rate is within 5 %. 90 = off.
# Setting type: Single
# Default value: 90
StabPeakMargin = 90

## Internal: airframe-default revision (inherited from the Ifrit FCS). Leave it alone.
# Setting type: Int32
# Default value: 13
AirframeRevision = 13

## Fuel burn multiplier at every throttle setting, afterburner included (0.65 = 35 % less fuel used per throttle setting). Buffed PerformanceProfile only.
# Setting type: Single
# Default value: 0.65
FuelConsumptionScale = 0.65

## Engine thrust multiplier (dry staticThrust and afterburner thrust alike). Revoker 0.1.0: 1.08. Buffed PerformanceProfile only. Fuel flow per power setting is unchanged by this; see FuelConsumptionScale.
# Setting type: Single
# Default value: 1.08
ThrustScale = 1.08

## Multiplier on every part's parasitic drag area (1 = stock). Revoker 0.1.0: 0.90 (10 % less parasitic drag). Buffed PerformanceProfile only.
# Setting type: Single
# Default value: 0.9
ParasiticDragScale = 0.9

## Revoker 0.1.0: 0 (off). Buffed profile only: post-stall AoA drag relief (F-22E 2.2.3 feature for Aryx's airfoils). The Revoker keeps its stock drag polar.
# Setting type: Single
# Default value: 0
AoADragRelief = 0

## Revoker 0.1.0: 0 (off). Buffed profile only: Mach drag relief (F-22E 1.8.38 feature). The Revoker keeps its stock transonic drag.
# Setting type: Single
# Default value: 0
TransonicDragRelief = 0

## Revoker 0.1.0: 0 (off). Both profiles: fraction of each part's AoA-dependent drag removed at low AoA (F-22E 2.2.3, a fix for Aryx's airfoil drag). The Revoker keeps its stock drag polar.
# Setting type: Single
# Default value: 0
LowAoADragRelief = 0

## 2.2.3: local AoA (deg) up to which LowAoADragRelief applies in full (both profiles).
# Setting type: Single
# Default value: 25
LowAoADragReliefFadeStart = 25

## Ifrit 0.3.1: the deceleron's deflection and its split share one travel: the game turns the two halves to deflection +- split, so a 30 deg deflection with a 30 deg split put one half at 60. Now |deflection| + split <= the deceleron travel (FlaperonRange); the deflection comes first and the split (airbrake and split yaw) gets what is left. false = 0.3.0 (they add).
# Setting type: Boolean
# Default value: true
DeceleronSplitBudget = true

## Revoker 0.1.0: 0 (off). Ifrit 0.3.1 feature: extra drag over a band of body AoA.
# Setting type: Single
# Default value: 0
AoADragBump = 0

## Ifrit 0.3.1: body |AoA| (deg) where the AoADragBump starts rising.
# Setting type: Single
# Default value: 18
AoADragBumpStart = 18

## Ifrit 0.3.1: body |AoA| (deg) of the full AoADragBump.
# Setting type: Single
# Default value: 24
AoADragBumpPeak = 24

## Ifrit 0.3.1: body |AoA| (deg) by which the AoADragBump is gone.
# Setting type: Single
# Default value: 35
AoADragBumpEnd = 35

## 2.2.3: local AoA (deg) by which the relief has gone over to its post-stall value: none in Stock, AoADragRelief in Buffed.
# Setting type: Single
# Default value: 30
LowAoADragReliefFadeEnd = 30

[6. Fuel]

## 2.0.6: move fuel between the healthy tanks to hold the centre of mass where the clean jet has it (centreline; stock fore/aft position without stores), against store asymmetry, a part shot off or a leaking tank. Only between attached, non-leaking, non-burning tanks; mass is conserved. All Ifrits simulated on this machine.
# Setting type: Boolean
# Default value: true
FuelBalancing = true

## 2.0.12: when the yaw or roll authority runs short (an engine out, a fin or wing section shot off), the balancing moves the CG sideways with fuel instead of holding it on the centreline: toward the live engine to shorten its thrust lever arm, or against an aerodynamic asymmetry. Only once the yaw or roll usage passes 0.75, only as far as evens out the roll and yaw usage (a sideways CG costs roll: ~15 deg/s^2 per g per 10 cm), at most 30 cm; back to the centreline once both are under 0.5 for 2 s. false = centreline always (2.0.6-2.0.11).
# Setting type: Boolean
# Default value: true
FuelTrim = true

## 2.0.12: fuel moved per second (kg/s, in total) while the fuel trim works (normal balancing: FuelTransferRate). Ifrit 0.4.1: 240 (was 120).
# Setting type: Single
# Default value: 240
FuelTrimRate = 240

## 2.0.6: total fuel the balancing moves per second (kg/s). Ifrit 0.4.1: 80 (was 40).
# Setting type: Single
# Default value: 80
FuelTransferRate = 80

## 2.0.6: lateral CG error (m) the balancing weighs as one unit; it leaves the fuel alone inside half of it.
# Setting type: Single
# Default value: 0.01
FuelBalanceLateralTolerance = 0.01

## 2.0.6: fore/aft CG error (m) the balancing weighs as one unit; it leaves the fuel alone inside half of it.
# Setting type: Single
# Default value: 0.03
FuelBalanceLongitudinalTolerance = 0.03

## 2.0.6: engines draw fuel only from tanks still attached, and the fuel gauge / fuel checks count only those (against the full original capacity); a tank on a part that has been shot off is not refuelled. false = stock (a shot-off tank's fuel keeps feeding the engines and showing on the gauge).
# Setting type: Boolean
# Default value: true
FuelFromAttachedTanksOnly = true

[7. Airbrake]

## Ifrit 0.3.0: 0.5 (0.2.2: 0.05). With the airbrake out, the allocator cost of bringing both splits in together (the brake symmetric part). With the 30 deg split and 100 deg/s servos, 0.05 let the allocator trade split for pitch and stall there (bench, 700 km/h at 3 km: splits held at 27, pitch rate drifting to -0.6 deg/s, no retraction on release). Higher keeps the full brake through pulls; one-sided retraction for yaw is free, as on the stock Ifrit.
# Setting type: Single
# Default value: 0.5
SplitBrakeHoldCost = 0.5

## In the AIR, the brake control deploys the airframe's split surfaces (the stock speedbrake mechanism). On the ground they stay stowed and the airbrake is the rollout surface configuration alone. The stock rule deployed them whenever the throttle was at idle, airborne as well as on the ground; the FCS drives them now, so idle throttle deploys nothing. false = split surfaces never deploy.
# Setting type: Boolean
# Default value: true
AirbrakeSplitInFlight = true

## Revoker 0.2.8 (TrailingEdgeBrakeConfig): outboard elevons trailing edge up with the airbrake out in the air, as the F-22E's ailerons. 0.2.9: the deflection is solved every frame so that the set adds no lift (with the canards' re-trim of its pitch counted): 14-19 deg on the bench at 400-1200 km/h. This key only switches the outboard share on (> 0) or off (0); 0.2.8 used it as a fixed deflection. The differential stays free for roll.
# Setting type: Single
# Default value: 20
AirbrakeOutboardElevonUp = 20

## Revoker 0.2.10 (TrailingEdgeBrakeConfig): the in-flight elevon brake set closes with AoA as the F-22E's speedbrake does (its AirbrakeAoAFade: full to ~15 deg AoA, half at ~25, stowed past ~35 on the clean jet): full to 15 deg |AoA|, closing linearly to stowed at 35, reopening as the AoA comes back. false = 0.2.9 (always the full set with the brake held). Takes effect at once.
# Setting type: Boolean
# Default value: true
TrailingEdgeBrakeAoAFade = true

## Revoker 0.2.8 (TrailingEdgeBrakeConfig): inboard elevon trailing-edge-down deflection (deg, of 25) with the airbrake out in the air, as the F-22E's flaperons.
# Setting type: Single
# Default value: 25
AirbrakeInboardElevonDown = 25

## Revoker 0.2.8 (TrailingEdgeBrakeConfig): outboard elevon trailing-edge-up deflection (deg, of 30) in the rollout aero-brake.
# Setting type: Single
# Default value: 30
GroundBrakeOutboardElevon = 30

## Revoker 0.2.8 (TrailingEdgeBrakeConfig): inboard elevon trailing-edge-up deflection (deg, of 25) in the rollout aero-brake.
# Setting type: Single
# Default value: 25
GroundBrakeInboardElevon = 25

## Revoker 0.2.18: 80 (0.2.8-0.2.17: 45; migrated once). Canard leading-edge-down deflection (deg) in the rollout aero-brake: drag, and a nose-down moment that keeps the nose wheel loaded. Capped by the canard's leading-edge-down travel (StabilatorRangeTEUp, 70), so 80 = all the way down. With 45 the brake alone stopped at 45 of the 70 and only brake + push reached the stop.
# Setting type: Single
# Default value: 80
GroundBrakeCanard = 80

[Asymmetric load]

## Ifrit 0.4.0: 22 (was 30; the Ifrit's engines sit 1.19 m off the centreline, one at AB is 24 deg/s^2 of yaw against 10-24 from the tails at 200-300 km/h and 20 deg AoA; bench one-engine pulls from 300 km/h: 18-25 hold without the throttle cut, 30 bleeds to 50-85 m/s and departs). 2.0.13: with an engine out the AoA limit is this, both signs, steady (plus whatever an aerodynamic asymmetry from damage needs on top). The dead engine's thrust yaw is left to the VMC protection (throttle, last resort) instead of the AoA cap, which made the limit follow speed and throttle (12 <-> 65 deg within seconds in 2.0.12).
# Setting type: Single
# Default value: 22
EngineOutAoACap = 22

## Ifrit 0.4.2: 40 (first 0.4.1 / 2.4.1 cut: 30, the engine-out cap; a running engine's split is a third to a half of a dead one's, and below the speed where the fins could not hold it the thrust match now takes over on prediction, so the cap only says where the full split is traded for matched thrust). Ifrit 0.4.1: with one engine running weak (damaged, not destroyed: under 85 % of the other's thrust, released above 92 %, 1 s filter) the AoA limit is this fixed value, both signs, instead of the dynamic thrust cap (which fell to 12 deg within 5 s in the 22 Oct 22:08 log and then followed IAS). The dead-engine case keeps EngineOutAoACap. The game caps a damaged engine at 50-100 % of its RPM range by its condition (no afterburner below condition ~0.6), so the weak engine makes 35-75 % of the good one's thrust at AB. Bench, full pulls from 300-400 km/h with the left engine at condition 0 / 0.5: 26-30 hold with 5-8 deg peak sideslip, 36 saturates the yaw once the speed is gone (throttle cut a third of the time, one departure), 45 departs.
# Setting type: Single
# Default value: 40
EngineDamagedAoACap = 40

## Ifrit 0.4.1: thrust-match limiter. With one engine down on thrust (predicted from the engines' damage state: an engine's reachable RPM is minRPM + (maxRPM - minRPM) x (0.5 x condition + 0.5), the dry thrust follows the RPM and the afterburner needs 85 % of maxRPM, i.e. condition above 0.55) and the AoA above EngineDamagedAoACap, the throttle input is held where the two engines still make the same thrust, so there is no thrust split and no AoA cap for it: you keep the full AoA, and the thrust comes back once you bring the AoA down to the cap yourself (on above cap + 2, off under cap + 0.5). Below the cap the throttle is free; the thrust split then brings the fixed EngineDamagedAoACap. With an engine OUT there is nothing to match: above EngineOutAoACap the throttle is held at military power (the afterburner's start). The VMC throttle protection (measured sideslip run-away) stays as the last resort. false = 0.4.0 (dynamic cap from the thrust split, nose pushed down).
# Setting type: Boolean
# Default value: true
EngineAbAoAGate = true

## 2.1.4: with an asymmetric load, past the rudder fade the roll and yaw rate limits also give up the stab deflection that trims the load's roll (the stabs are both the roll and the yaw source there), not only the yaw part of the load; past the rudder fade the yaw anchor and sideslip lead also act at positive AoA; and (2.1.6) a roll brake or reversal accelerates no faster than the yaw left after the load can follow. Only the load beyond the deadbands / a lateral CG offset over 4 cm counts; a clean jet is unchanged. false = 2.1.3. Takes effect at once.
# Setting type: Boolean
# Default value: true
AsymSharedStabLateral = true

## Cap the AoA when an asymmetric load (e.g. one heavy store on one wing) would use more of the roll/yaw control authority than AsymLateralReserve leaves free. The cap is the stick's full-travel AoA (the stick is remapped onto it). A load within the margin is simply trimmed out by the control loop (no cap). Not applied in MPO.
# Setting type: Boolean
# Default value: true
AsymLoadAoALimit = true

## The roll-rate and roll-acceleration limits count only the roll authority left in each direction after the measured asymmetric trim (asymmetric store, wing damage). The trim is learned from the measured non-control roll moment minus roll damping while the jet is not rolling (under 20 deg/s) and held during rolls; it only ever lowers the limit on the loaded side. With the left wing shot off it stops a full right roll at the AoA cap from saturating the stabs and rudders, building sideslip and departing. No effect on a symmetric jet. false = pre-1.8.17.
# Setting type: Boolean
# Default value: true
AsymRollHeadroom = true

## Share of the roll/yaw control authority kept free for the pilot's roll and pedal commands (0..1). Used together with AsymRollReserveAccel / AsymYawReserveAccel: whichever asks for more sets the cap. Higher = lower cap, more roll/yaw left.
# Setting type: Single
# Default value: 0.35
AsymLateralReserve = 0.35

## Asymmetric roll acceleration (deg/s^2) ignored before any cap is considered - the airframe is never perfectly symmetric even clean (off-centre gun and ammunition, engines never exactly matched). The yaw deadband is a quarter of this. A balanced loadout stays well inside it; one 300 kg store is far outside it.
# Setting type: Single
# Default value: 5
AsymDeadbandAccel = 5

## Roll acceleration (deg/s^2) that must stay available to the pilot after the asymmetric load is trimmed out, whatever AsymLateralReserve works out to. Post-stall a share of the remaining authority is almost nothing, so this absolute floor is what sets the cap up high and at low speed. Higher = lower cap.
# Setting type: Single
# Default value: 80
AsymRollReserveAccel = 80

## Same for yaw acceleration (deg/s^2).
# Setting type: Single
# Default value: 20
AsymYawReserveAccel = 20

## DEFAULT 0 (off) since 1.8.17. Hands the CHANGE in the modelled asymmetric moment straight to the allocator, washed out over AsymFeedForwardWashout seconds. Inside the INDI loop an added moment is not a one-off kick: the loop measures the acceleration it causes and settles with a steady roll-rate error of about FF/(I x KRoll) for as long as the term lasts, and while the load keeps changing (pulling, levelling off) it lasts the whole time. With a wing shot off it gave a 20-35 deg/s roll drift in pulls and level-offs and helped depart the jet. The loop already measures the asymmetric moment. 1 = pre-1.8.17.
# Setting type: Single
# Default value: 0
AsymFeedForward = 0

## Time constant (s) over which the feed-forward above hands the load back to the control loop.
# Setting type: Single
# Default value: 1
AsymFeedForwardWashout = 1

## AsymFeedForward fades out over the 12 deg of sideslip above this and is off beyond it: the asymmetric moment it is built from is modelled at zero sideslip, so at large sideslip (falling leaf) it is not a measurement of anything.
# Setting type: Single
# Default value: 6
AsymFeedForwardMaxSideslip = 6

## AsymFeedForward fades out over the 15 deg of AoA above this and is off beyond it. Post-stall the lateral authority it would spend is what the manoeuvre needs.
# Setting type: Single
# Default value: 40
AsymFeedForwardMaxAoA = 40

## The roll reserve also has to cover the roll rate the law allows at this speed, reached in this many seconds. At high IAS that is what sets the reserve (250 deg/s in 0.5 s = 500 deg/s^2), not AsymRollReserveAccel. 0 = off (fixed reserve only).
# Setting type: Single
# Default value: 0.5
AsymRollTau = 0.5

## The cap relaxes faster the further the demand is below the limit: rate = AsymCapRelaxRate x (1 + this x margin). With the load gone the cap comes back at (1 + this) x the base rate. 0 = fixed rate.
# Setting type: Single
# Default value: 4
AsymCapRelaxBoost = 4

## With more than half the lateral authority taken by an asymmetric load, the allocator's roll and yaw weight is raised by up to this factor (1 = up to double) so the surfaces hold the jet straight before they fine-tune pitch. DEFAULT 0 (off) since 1.7.11: it starves the pitch axis, which showed up as the nozzles running nose-down in rolling pulls.
# Setting type: Single
# Default value: 0
AsymAxisPriorityBoost = 0

## The asymmetric-load cap never goes below this positive AoA (deg).
# Setting type: Single
# Default value: 12
AsymMinAoACap = 12

## The asymmetric-load cap never goes closer to 0 than this on the negative side (deg, magnitude).
# Setting type: Single
# Default value: 8
AsymMinAoACapNegative = 8

## How fast the cap comes down when the asymmetry grows (deg/s).
# Setting type: Single
# Default value: 10
AsymCapTightenRate = 10

## How fast the cap goes back up when the asymmetry shrinks (store released, fuel, speed) (deg/s).
# Setting type: Single
# Default value: 8
AsymCapRelaxRate = 8

## Above the cap (it just came down), AoA is brought back to it at up to this rate (deg/s). Not cancelled by full stick.
# Setting type: Single
# Default value: 15
AsymCapRecoveryRate = 15

## Below this IAS (m/s) the cap is held at its last value instead of being recomputed (no aero authority to judge by).
# Setting type: Single
# Default value: 35
AsymMinIAS = 35

## 1.8.45: lateral demand (load share of the authority left after the reserve) at which the asymmetric-load AoA cap sits (1.8.44 and before: 1.0). With a light mixed load (6.5 cm lateral CG offset) the demand rises ~0.025 per degree above the cap, so 1.08 lets ~3 deg more AoA; heavier loads, whose demand rises faster with AoA, gain less.
# Setting type: Single
# Default value: 1.08
AsymCapDemand = 1.08

## 1.8.45: time constant (s) with which the asymmetric-load cap may rise. Each 0.2 s sweep's cap goes through a median of the last three and then this low-pass; a lower cap is followed with 0.3 s. The raw cap moved 1-8 deg every sweep (4.4 Hz) with a 6.5 cm lateral offset at 35-40 deg AoA, which is what made full-aft stick twitch.
# Setting type: Single
# Default value: 1
AsymCapSmoothing = 1

## 1.8.45: seconds of IAS decay projected ahead (filtered IAS rate, rapid decelerations only, see DecelStart/DecelFull). The asymmetric-load cap is judged, and the high-AoA roll/yaw rate limits are set, at the dynamic pressure of that predicted IAS, so they come down before the surfaces lose the authority. 0 = off.
# Setting type: Single
# Default value: 1
DecelLookahead = 1

## 1.8.45: IAS deceleration (m/s^2) below which nothing is anticipated. Between this and DecelFull the deceleration is weighted by the square of where it sits, so ordinary turning bleed (and most of a J-turn's tail) predicts almost nothing and a collapsing corkscrew predicts nearly all of it.
# Setting type: Single
# Default value: 6
DecelStart = 6

## 1.8.45: IAS deceleration (m/s^2) from which it is anticipated in full.
# Setting type: Single
# Default value: 20
DecelFull = 20

[Ground]

## The take-off/landing rotation law (closed-loop pitch with the mains on the ground) only arms above this TAS (m/s). It used to arm at 15 m/s, an ordinary taxi speed, where it flew closed-loop pitch against the ground constraint and threw the surfaces about. It disarms 8 m/s below this.
# Setting type: Single
# Default value: 45
RotationMinSpeed = 45

## 2.0.6: on the runway above RotationMinSpeed, pulling the stick hands pitch to the same rate law as gear-down flight, held through the rotation and lift-off (the rate command, its limits and stick scaling are the airborne ones). Stick neutral or forward with all three wheels down for 0.3 s goes back to the open-loop ground mode (steering, aero-brake). false = 2.0.5 behaviour (open-loop stick until the nose is up, then RotationRate).
# Setting type: Boolean
# Default value: true
GroundRateLaw = true

## Revoker 0.2.9: 600 (F-22E 60). At 60 the nose stayed on the wheel for 0.7-0.85 s after a full pull at 200-320 km/h on the bench (in game, 29 Oct 00:25 log at 283 km/h: two full pulls of 0.45 s each did not lift it); at 600 it lifts in 0.16-0.20 s, with the same or smaller pitch-rate overshoot after lift-off. 2.0.6: while the nose wheel still touches in the ground rate law, the nose-up pitch moment the FCS asks for may grow by at most this much per second (in deg/s^2 of pitch acceleration). Stops the surfaces winding to full deflection against the nose leg and over-rotating when it lifts.
# Setting type: Single
# Default value: 600
GroundRotationRamp = 600

## 1.8.36: fly-by-wire ground steering. Pedal commands a yaw rate (GroundYawRateMax at taxi speed, limited to GroundLateralAccel of turn at speed); pedal released = yaw braking to zero rate, then the jet holds a straight line along the track it had (a crab/drift at touchdown is steered out, the heading lined up with the track). The nose wheel is steered by the FCS (kinematic feed-forward + yaw-rate feedback) and, in the ground roll, the rudders join the yaw-rate loop. Below 1.5 m/s the pedal steers the wheel directly (pivoting). false = stock: pedal sets the nose-wheel angle, rudders follow the pedal.
# Setting type: Boolean
# Default value: true
NoseWheelFbw = true

## Full-pedal yaw rate on the ground (deg/s) at taxi speed.
# Setting type: Single
# Default value: 15
GroundYawRateMax = 15

## Full pedal never asks for more than this lateral acceleration (m/s^2) in a ground turn: the yaw-rate command is min(GroundYawRateMax, this / ground speed). 2.5 = full pedal gives 2 deg/s at 260 km/h.
# Setting type: Single
# Default value: 2.5
GroundLateralAccel = 2.5

## Pedal released: how strongly the jet steers back onto the straight line it was on (1 = full, 0 = hold the track direction only and accept the sideways offset a gust or touchdown drift left).
# Setting type: Single
# Default value: 1
GroundLineHold = 1

## 0.5.2: with NoseWheelFbw on, stock steering with a drift limit and the straight-line correction. While the pedal is in (and after release until the yaw has stopped) the nose wheel, the rudders and the differential brake get the stock fly-by-wire's yaw, computed with the jet's own stock parameters (yaw-rate command with yaw damping; raw pedal below the stock minimum speed), so the turn is stock; GroundDrift* limit the sideslip on top. Once the yaw has stopped the FCS holds the straight line along the track until the pedal moves; at touchdown it holds the approach track. GroundYawRateMax and GroundLateralAccel are not used. false = the capped yaw-rate law of 1.8.36-0.4.9.
# Setting type: Boolean
# Default value: true
GroundStockMatch = true

## 0.5.3: the negative-AoA push + roll limiters (sideslip lead and yaw-anchored roll, 2.1.0) also act with the gear down in the air (not with a wheel on the ground). false = off with the gear down, as before.
# Setting type: Boolean
# Default value: true
GearDownSlipProtect = true

## 0.5.4: INDI on the nose wheel after the pedal is released - the release braking (stop the yaw) and the straight-line / touchdown hold. The wheel effectiveness comes from the game each tick (nose-leg load, tyre friction and slope, CG and yaw inertia); the measured yaw acceleration covers the rest. While the pedal is in the steering stays stock. false = 2.4.13 (stock law on release, PI line hold).
# Setting type: Boolean
# Default value: true
GroundIndi = true

## 0.5.4: INDI nose wheel: wanted yaw acceleration per deg/s of yaw-rate error (1/s).
# Setting type: Single
# Default value: 15
GroundIndiGain = 15

## 0.5.4: INDI nose wheel: low-pass time constant (s) on the measured yaw acceleration and the tyre-force estimate.
# Setting type: Single
# Default value: 0.04
GroundIndiTau = 0.04

## 0.5.2: sideslip (deg) the jet may drift to on the ground before the steering counters it (stock steering does not limit it). 8 = about half of the Ifrit stock-pedal drift above 50 kt (27 Oct logs: 17-25 deg peaks, 42 in a slalom). 0 = hold the nose on the track; large = no limit.
# Setting type: Single
# Default value: 8
GroundDriftAllow = 8

## 0.5.2: counter-yaw per degree of sideslip past GroundDriftAllow (1 = full pedal; 0.2 = full counter-yaw 5 deg past the allowance). 0 = drift limit off.
# Setting type: Single
# Default value: 0.2
GroundDriftGain = 0.2

## 0.5.2: the drift limit acts on the sideslip predicted this far ahead (s) from its rate, so a fast skid is caught before it overshoots.
# Setting type: Single
# Default value: 0.25
GroundDriftLead = 0.25

## 0.5.2: the drift limit fades in from this ground speed (m/s) to 10 m/s above it (default 15-25 m/s = 29-49 kt), so tight taxi turns keep their natural sideslip.
# Setting type: Single
# Default value: 15
GroundDriftFadeSpeed = 15

