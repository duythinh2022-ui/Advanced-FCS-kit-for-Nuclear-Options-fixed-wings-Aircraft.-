# Default value: 25
RateBlendAoAMinNegative = 25

## 1.9.0: the AoA limit is held below the AoA where the nose-down authority you have now runs out: stabilators full nose-down, flaperons at their trim, plus the nozzles at the present thrust (none above the thrust-vectoring cut-off, 450 m/s true airspeed - the high-altitude supersonic case where the nozzles freeze). Bench, 350 km/h: zero thrust 23 deg, ~0.1 T/W 26 deg, 30 % throttle 34 deg, full afterburner no cap; a full pull then full push recovers in every case (1.8.45 departed to 73-90 deg at the first two). The stick is remapped onto the capped envelope like the asymmetric-load cap. false = 1.8.45.
# Setting type: Boolean
# Default value: true
LowThrustAoACap = true

## 1.9.0: nose-down pitch acceleration (deg/s^2) that must be left at the cap. Higher = lower cap.
# Setting type: Single
# Default value: 8
LowThrustCapMargin = 8

## 1.9.0: the low-thrust AoA cap never goes below this (deg).
# Setting type: Single
# Default value: 20
LowThrustCapFloor = 20

## 2.0.5: below this thrust-to-weight the nozzles are treated as not covering pitch and the AoA limit is fixed at NoTvcAoACapPositive / Negative (+-36 by default; 2.0.8 and before: +36 only, released 0.03 above). The swept LowThrustAoACap still applies under it.
# Setting type: Single
# Default value: 0.3
LowThrustFixedAoATW = 0.3

[3. Lateral-directional]

## Ifrit 0.2.0, separate axes: with the pedals centred and below the coupling AoA, the yaw axis lets sideslip wash out at this rate (deg/s of yaw rate per deg of sideslip), like the airframe's own weathervane. Sideslip is kept inside +-PedalSideslip there. 0 = the yaw rate is held exactly (sideslip stays where the roll left it).
# Setting type: Single
# Default value: 0.5
MpoSideslipWashout = 0.5

## Ifrit: the split-flap decelerons are allocator effectors (drag yaw; the game splits a flap from its job's yaw input). The stock zero-throttle airbrake split is suppressed while the FCS flies. false = the flaps never split while the FCS is engaged. Applied when the jet spawns.
# Setting type: Boolean
# Default value: true
SplitFlapYaw = true

## Ifrit: differential (roll) nozzle deflection about the pitch angle, the Ifrit's stock roll vectoring (+-15 deg), as an allocator effector. false = pitch-only TVC like the F-22E law. Applied when the jet spawns.
# Setting type: Boolean
# Default value: true
RollTvc = true

## Ifrit 0.3.0: the sideslip correction may use body roll up to what the wing surfaces plus the differential TVC can brake, instead of being held to the aero yaw-rate limit. At high AoA the correction is mostly body roll (x sin AoA), and the nozzles roll the jet at any IAS. false = 0.2.2.
# Setting type: Boolean
# Default value: true
SlipTvcAssist = true

## Ifrit 0.3.0 (SlipTvcAssist): the sideslip gain (KBeta) ramps to this from 25 to 45 deg AoA, where the correction is mostly body roll from the nozzles. Bench, 65 deg corkscrew, 1 s full-pedal kick: back under 3 deg in 4.3-4.7 s at 1.3, 0.5-0.8 s at 4. Below 25 deg KBeta applies as before.
# Setting type: Single
# Default value: 4
SlipGainHighAoA = 4

## Ifrit 0.3.9: below this true airspeed (m/s) the roll is not held back for sideslip or yaw coordination (sideslip guard / governor, yaw-anchored roll limit, roll-acceleration coordination cap); they come back in over RollSlackTASSpan (smoothstep) and are off past 120 deg |AoA|. Higher = more roll slack at low speed, more sideslip.
# Setting type: Single
# Default value: 25
RollSlackMinTAS = 25

## Ifrit 0.3.9: m/s over which the roll limiters come back in above RollSlackMinTAS (default: full from 75 m/s TAS, 270 km/h). Bench, full stick from near zero airspeed accelerating to 250 km/h: 25/50 holds 21-44 deg/s where 20/30 sat at 11 deg/s; corkscrew from 150 km/h and slow rolls unchanged.
# Setting type: Single
# Default value: 50
RollSlackTASSpan = 50

## Ifrit 0.3.7: the sideslip hold is off below this true airspeed (m/s) and fades in over SlipHoldTASSpan; it also fades out from 100 to 120 deg |AoA| (flying backwards). Pedals keep commanding yaw there. In tail slides and near zero airspeed the hold asked for yaw it had no authority for: the jet swayed left/right and the roll stick was scaled to nothing. 0 = 0.3.6 at speed (reversed-flow fade still applies).
# Setting type: Single
# Default value: 15
SlipHoldMinTAS = 15

## Ifrit 0.3.7: m/s over which the sideslip hold fades in above SlipHoldMinTAS (default: full from 35 m/s TAS).
# Setting type: Single
# Default value: 20
SlipHoldTASSpan = 20

## Ifrit 0.3.5: sideslip predictor window (s), the inner roll/yaw rate loops' lag in game (~0.3 s in the 20 Oct logs). The sideslip correction works on the sideslip minus the yaw (stability-axis) rate it has already commanded over this window, which has not reached the sideslip yet. Fixes the 0.7 Hz sideslip / roll oscillation at the high-AoA sideslip gain (20 Oct 22:37 and 23:10 logs). 0 = off (0.3.2). Replaces 0.3.3's SlipRateLead.
# Setting type: Single
# Default value: 0.3
SlipPredictTime = 0.3

## Ifrit 0.4.0: roll-stick fraction over which the sideslip predictor fades OUT (0.3.5-0.3.9: 0.2, i.e. the predictor was off whenever roll stick was in). 0 = the predictor runs with roll stick in too. 22 Oct 00:30 log, 65 deg AoA corkscrew at 55 m/s with full roll stick held: without the predictor the high-AoA sideslip loop (gain 4) rang against the ~0.34 s inner-loop lag, sideslip +-12 deg and body roll +-50 deg/s on a 1.6 s cycle, every roll surface and the nozzles bang-bang on their stops. A delay-loop model with that lag and 60-100 deg/s^2 of roll authority reproduces the +-10-12 deg cycle without the predictor and settles 12 -> -1.5 -> 0.5 deg in 1.6 s with it.
# Setting type: Single
# Default value: 0
SlipPredictRollGate = 0

## Ifrit 0.4.0: least drag first with an engine out or a damaged yaw axis. The canted tails carry the yaw as long as they can; the inner/outer flaperon crossing comes next (the allocator finds it), the split decelerons open only for the yaw still out of reach (a gate on measured yaw saturation that leaks shut once the yaw is met, the split then having priority over its deceleron's deflection for their shared travel), the VMC throttle limit last. Bench, yaw per kN of added drag at 250 km/h and 20 deg AoA: tails +-10 deg 4.8 deg/s^2, crossing 1.1-1.5, one split at 30 deg 0.4 (17.7 kN of drag), the throttle cut 0.17, false = 0.3.9 (tails and splits one tier, the split free: with the right engine alone at 140 m/s the left split sat at 15-24 deg while the tails held +-2 deg; at the 30 deg cap the flaperons crossed with the splits shut and the engine cut to 30-40 %). Both engines running: no change.
# Setting type: Boolean
# Default value: true
SplitYawTier = true

## Ifrit 0.4.0 (SplitYawTier): with an engine out or a damaged yaw axis, how far (0-1) the roll-fight cost is relaxed for the canted tails, so their differential may buy yaw with the wing taking the roll back. 0 = the 1.8.41 fight cost in full (the allocator then prefers sideslip or the splits to a tail difference).
# Setting type: Single
# Default value: 1
StabYawRelax = 1

## Ifrit 0.3.5: washout (s) on the predictor's command history, so a held correction (e.g. a yaw trim against a load) leaves no extra steady sideslip. 0 = no washout.
# Setting type: Single
# Default value: 1.5
SlipPredictWashout = 1.5

## Ifrit 0.3.4 (ReversedFlowRollSense): |AoA| (deg) where the roll stick sense starts to turn over for reversed flow. It blends smoothly to fully flipped at ReversedFlowSenseEnd, passing through zero. 0.3.2 flipped at once at 100 deg (released at 80), next to 90 deg, where the velocity-vector roll is nearly all body yaw, so the flip reversed the rotation mid-manoeuvre.
