# Default value: 150
ReversedFlowSenseEnd = 150

## Ifrit 0.3.1: AoA (deg) where the SlipGainHighAoA ramp starts (0.3.0: 25); it reaches SlipGainHighAoA 20 deg higher. Pedals centred only. Bench, corkscrew entry at 475 km/h: from 25 the sideslip built at 15-20 deg AoA and the rolling-pull governor held the AoA there (the 20 deg hitch).
# Setting type: Single
# Default value: 5
SlipGainAoAStart = 5

