# Default value: 1
ActuatorSpeedScale = 1

## Stabilator travel, trailing edge up (deg). 0 = Aryx's original (30, symmetric).
# Setting type: Single
# Default value: 0
StabilatorRangeTEUp = 0

## Stabilator travel, trailing edge down (deg). 0 = Aryx's original (30, symmetric).
# Setting type: Single
# Default value: 0
StabilatorRangeTEDown = 0

## Ifrit 0.3.0: travel each way for the ailerons (outer) and decelerons (inner) (deg). Stock: ailerons 30, decelerons 20. 0 = stock.
# Setting type: Single
# Default value: 30
FlaperonRange = 30

## Ifrit 0.3.0: servo speed of every control surface (deg/s), the F-22E FCS's 100. Stock: stabilators 60, ailerons 45, decelerons 70. 0 = the stock speeds x ActuatorSpeedScale. TVC: TvcSlewRate.
# Setting type: Single
# Default value: 100
SurfaceServoSpeed = 100

## Ifrit 0.3.0: deceleron split limit (deg), for the airbrake and for split yaw. 0 = the decelerons' own travel (FlaperonRange, 30); the stock limit is 25. Split drag is split x splitDrag x rho x v^2, so 30 is 20 % more than 25.
# Setting type: Single
# Default value: 0
SplitRange = 0

## Pitch thrust-vectoring travel each way (deg, game maximum 20). 0 = Aryx's original (10).
# Setting type: Single
# Default value: 0
TvcPitchRange = 0

## TVC nozzle slew rate (deg/s). 0 = follow ActuatorSpeedScale like the control surfaces (70 x scale).
# Setting type: Single
# Default value: 70
TvcSlewRate = 70

## 2.0.11: default 90 (off, 2.0.8 behaviour). 2.0.10: below 40 deg body AoA a stab is not commanded more than this many degrees past its lift peak (local AoA, either sign); the limit opens up from 40 to 50 deg AoA (deep-stall use above, e.g. falling leaf, unchanged). Stops the stabs swinging through deep stall in rolls at 36 deg and parking past the peak after a roll (10:00 flight). Bench, full roll at 36 deg with TVC off: stab rate 40 -> 16 deg/s rms, roll rate 27-33 -> 19-25 deg/s; with TVC on the roll rate is within 5 %. 90 = off.
# Setting type: Single
# Default value: 90
StabPeakMargin = 90

## Internal: the airframe-default revision this file was last updated to (3 = 2.0.3's flaperon 1.2 / LERX 1.2 / stab 1.2, 5 = 2.0.11, 6 = 2.0.12, 7-10 = the F-22E 2.2.23-2.2.29 defaults, ported in Ifrit 0.3.0). Leave it alone.
# Setting type: Int32
# Default value: 0
AirframeRevision = 13

## Fuel burn multiplier for every engine at every throttle setting, afterburner included (0.65 = 35 % less fuel used; 0.4.0: 0.75). All Ifrits.
# Setting type: Single
# Default value: 0.65
FuelConsumptionScale = 0.65

## Engine thrust multiplier (dry staticThrust and afterburner thrust alike, so max-AB total scales the same). Fuel flow per power setting is unchanged.
# Setting type: Single
# Default value: 1.08
ThrustScale = 1.08

## Multiplier on every part's parasitic drag area (1 = stock). Ifrit 0.2.2: 0.95 (0.2.0-0.2.1: 0.885). Buffed PerformanceProfile only.
# Setting type: Single
# Default value: 0.95
ParasiticDragScale = 0.95

## 2.2.3: Buffed profile only, the AoA drag relief above the LowAoADragRelief fade band (post-stall); below it LowAoADragRelief applies. 1.8.38-2.2.2: fraction of the drag that comes from AoA (each part's airfoil drag above that airfoil's minimum) removed at every AoA. A pure scaling of the AoA-dependent drag, so the drag-vs-AoA curve keeps the game's shape with no bump or dip anywhere (a band limited to 5-27 deg would need hand-over zones that make the drag slope dip or hump). 0.25 = drag -20 % averaged over 5-27 deg AoA from this relief alone (about -11 % at 5, -18 % at 10, -22 % at 20, -23 % at 27; -4 % at 2, 0 at 0), on top of TransonicDragRelief; nothing changes at the minimum-drag AoA. Given back per part with the game's own drag model, as a force along each part's airflow. 0 = off. Ignored in the Stock PerformanceProfile.
# Setting type: Single
# Default value: 0.25
AoADragRelief = 0.25

## Ifrit 0.2.2: 0.1 (0.2.0-0.2.1: 0.2). 1.8.38: Mach drag relief. The slope of drag vs Mach is scaled from the game's (below Mach 0.2) down to 1 - 1.1 x this (above Mach 0.7) and held there, never coming back, so there is no dip or hump in the drag curve. With 0.2: total drag -6 % at Mach 0.5, -12 % at 0.7, -16 % at 0.9, -17 % at 1.0, -19 % at 1.2, -20 % at 1.5, -20.5 % at 1.8. 0 = off. Ignored in the Stock PerformanceProfile.
# Setting type: Single
# Default value: 0.1
TransonicDragRelief = 0.1

## 2.2.3: both profiles. This fraction of each part's AoA-dependent drag (its airfoil drag above that airfoil's minimum) is removed from low AoA up to LowAoADragReliefFadeStart; across the fade band it goes over to none in the Stock profile (post-stall drag is Aryx's) or to AoADragRelief in the Buffed profile. Stock thrust, parasitic drag and fuel burn are unchanged. Why: Aryx's airfoil drag rises steeply with AoA, so with no relief the best sustained turn sat at ~520 km/h IAS and 5.8 g (3 km, clean, 50 % fuel). Bench, Stock profile, same case: 0.15 -> 20.3 deg/s at 560 km/h, 6.6 g; 0.25 -> 21.2 at 600, 7.4 g; 0.35 -> 22.2 at 640, 8.2 g (no relief: 19.1). Instantaneous turn and 1 g top speed unchanged. 0 = Aryx's drag below the fade band.
# Setting type: Single
# Default value: 0.35
LowAoADragRelief = 0.35

## 2.2.3: local AoA (deg) up to which LowAoADragRelief applies in full (both profiles).
# Setting type: Single
# Default value: 25
LowAoADragReliefFadeStart = 25

## Ifrit 0.3.1: the deceleron's deflection and its split share one travel: the game turns the two halves to deflection +- split, so a 30 deg deflection with a 30 deg split put one half at 60. Now |deflection| + split <= the deceleron travel (FlaperonRange); the deflection comes first and the split (airbrake and split yaw) gets what is left. false = 0.3.0 (they add).
# Setting type: Boolean
# Default value: true
DeceleronSplitBudget = true

## Ifrit 0.3.1, both profiles: extra drag (fraction of the whole drag, after the relief) over a band of body AoA, same on the push side. 0 below AoADragBumpStart, rising smoothly to this at AoADragBumpPeak and falling smoothly back to 0 at AoADragBumpEnd. 0 = off.
# Setting type: Single
# Default value: 0.3
AoADragBump = 0.3

## Ifrit 0.3.1: body |AoA| (deg) where the AoADragBump starts rising.
# Setting type: Single
# Default value: 18
AoADragBumpStart = 18

## Ifrit 0.3.1: body |AoA| (deg) of the full AoADragBump.
# Setting type: Single
# Default value: 24
AoADragBumpPeak = 24

## Ifrit 0.3.1: body |AoA| (deg) by which the AoADragBump is gone.
# Setting type: Single
# Default value: 35
AoADragBumpEnd = 35

## 2.2.3: local AoA (deg) by which the relief has gone over to its post-stall value: none in Stock, AoADragRelief in Buffed.
# Setting type: Single
# Default value: 30
LowAoADragReliefFadeEnd = 30

[6. Fuel]

## 2.0.6: move fuel between the healthy tanks to hold the centre of mass where the clean jet has it (centreline; stock fore/aft position without stores), against store asymmetry, a part shot off or a leaking tank. Only between attached, non-leaking, non-burning tanks; mass is conserved. All Ifrits simulated on this machine.
# Setting type: Boolean
# Default value: true
FuelBalancing = true

## 2.0.12: when the yaw or roll authority runs short (an engine out, a fin or wing section shot off), the balancing moves the CG sideways with fuel instead of holding it on the centreline: toward the live engine to shorten its thrust lever arm, or against an aerodynamic asymmetry. Only once the yaw or roll usage passes 0.75, only as far as evens out the roll and yaw usage (a sideways CG costs roll: ~15 deg/s^2 per g per 10 cm), at most 30 cm; back to the centreline once both are under 0.5 for 2 s. false = centreline always (2.0.6-2.0.11).
# Setting type: Boolean
# Default value: true
FuelTrim = true

## 2.0.12: fuel moved per second (kg/s, in total) while the fuel trim works (normal balancing: FuelTransferRate). Ifrit 0.4.1: 240 (was 120).
# Setting type: Single
# Default value: 240
FuelTrimRate = 240

## 2.0.6: total fuel the balancing moves per second (kg/s). Ifrit 0.4.1: 80 (was 40).
# Setting type: Single
# Default value: 80
FuelTransferRate = 80

## 2.0.6: lateral CG error (m) the balancing weighs as one unit; it leaves the fuel alone inside half of it.
# Setting type: Single
# Default value: 0.01
FuelBalanceLateralTolerance = 0.01

## 2.0.6: fore/aft CG error (m) the balancing weighs as one unit; it leaves the fuel alone inside half of it.
# Setting type: Single
# Default value: 0.03
FuelBalanceLongitudinalTolerance = 0.03

## 2.0.6: engines draw fuel only from tanks still attached, and the fuel gauge / fuel checks count only those (against the full original capacity); a tank on a part that has been shot off is not refuelled. false = stock (a shot-off tank's fuel keeps feeding the engines and showing on the gauge).
# Setting type: Boolean
# Default value: true
FuelFromAttachedTanksOnly = true

[7. Airbrake]

## Ifrit 0.3.0: 0.5 (0.2.2: 0.05). With the airbrake out, the allocator cost of bringing both splits in together (the brake symmetric part). With the 30 deg split and 100 deg/s servos, 0.05 let the allocator trade split for pitch and stall there (bench, 700 km/h at 3 km: splits held at 27, pitch rate drifting to -0.6 deg/s, no retraction on release). Higher keeps the full brake through pulls; one-sided retraction for yaw is free, as on the stock Ifrit.
# Setting type: Single
# Default value: 0.5
SplitBrakeHoldCost = 0.5

## In the AIR, the brake control deploys the airframe's split surfaces (the stock speedbrake mechanism). On the ground they stay stowed and the airbrake is the rollout surface configuration alone. The stock rule deployed them whenever the throttle was at idle, airborne as well as on the ground; the FCS drives them now, so idle throttle deploys nothing. false = split surfaces never deploy.
# Setting type: Boolean
# Default value: true
AirbrakeSplitInFlight = true

[Asymmetric load]

## Ifrit 0.4.0: 22 (was 30; the Ifrit's engines sit 1.19 m off the centreline, one at AB is 24 deg/s^2 of yaw against 10-24 from the tails at 200-300 km/h and 20 deg AoA; bench one-engine pulls from 300 km/h: 18-25 hold without the throttle cut, 30 bleeds to 50-85 m/s and departs). 2.0.13: with an engine out the AoA limit is this, both signs, steady (plus whatever an aerodynamic asymmetry from damage needs on top). The dead engine's thrust yaw is left to the VMC protection (throttle, last resort) instead of the AoA cap, which made the limit follow speed and throttle (12 <-> 65 deg within seconds in 2.0.12).
# Setting type: Single
# Default value: 22
EngineOutAoACap = 22

## 1.2.0: with a lateral CG offset, take the AoA cap from the coupled check (roll each way with the load held, pitch held, no sideslip acceleration; every surface and, while vectoring, the nozzles counted) instead of the one-axis check. Bench, full aft on afterburner (share 0.75): 30 cm 16-20 deg (1.1.3: 12 deg at speed), 16 cm 22.5-26 deg steady (1.1.3 jumped between 12 and 65), 8 cm 58-65 (unchanged); with about 12 cm the limit is about 31 deg where 1.1.3 flew 63, and a roll spam there makes 6-8.5 deg of sideslip (1.1.3: 3-5). false = 1.1.3's one-axis check. Takes effect at the next sweep (0.2 s).
# Setting type: Boolean
# Default value: true
AsymCoupledCheck = true

## 1.2.0: with a lateral CG offset the AoA cap comes from the coupled check: at each AoA, the most flight-path roll each way with the load held, pitch held and no sideslip acceleration, every surface (and with vectoring on and the thrust up, both nozzle pairs) counted. This is the largest share of that roll range the pilot's reserve may claim; the cap sits where the weaker side is down to about this share of the mean of the two sides. Bench, 30 cm of offset (2,450 kg on a wing), full aft stick on afterburner, 250-600 km/h: 0.7 = cap 16-21 deg, but after a full roll at 450 km/h the load rolled the jet off at 18-25 deg/s with the stick centred; 0.75 = 16-19.5 deg, drift 1-3 deg/s; 0.8 = 15-18 deg, and 8 cm loads lose 25 deg of limit (65 -> 37-40) with a jump. Higher = lower cap, more roll left. Takes effect at the next sweep (0.2 s).
# Setting type: Single
# Default value: 0.75
AsymCoupledReserveMax = 0.75

## 1.2.0: the same share for the coupled check with the nozzles locked, cut out by speed or the thrust low (T/W under LowThrustFixedAoATW). There the surfaces also make the pitch-in, so more of the roll range is kept. Higher = lower cap, more roll left. Takes effect at the next sweep (0.2 s).
# Setting type: Single
# Default value: 0.8
AsymCoupledReserveMaxNoTvc = 0.8

## Ifrit 0.8.1: with an engine out the AoA limit is EngineOutAoACap (22) while the tails hold the live engine's yaw easily, and slides down toward this as the yaw gets close to what they can hold: the predicted yaw usage at the throttle you set (the thrust yaw against the tails' authority at the IAS 1.5 s ahead) from 0.6 to 0.9, or the measured yaw saturation with the stick lateral-quiet. It moves 2 deg/s down and 1 deg/s up. Lower AoA keeps more speed and more tail authority in a slow climb, so the VMC protection does not have to cut the engine as early. Set it equal to EngineOutAoACap for the fixed 0.8.0 limit.
# Setting type: Single
# Default value: 18
EngineOutAoACapMin = 18

## Ifrit 0.4.2: 40 (first 0.4.1 / 2.4.1 cut: 30, the engine-out cap; a running engine's split is a third to a half of a dead one's, and below the speed where the fins could not hold it the thrust match now takes over on prediction, so the cap only says where the full split is traded for matched thrust). Ifrit 0.4.1: with one engine running weak (damaged, not destroyed: under 85 % of the other's thrust, released above 92 %, 1 s filter) the AoA limit is this fixed value, both signs, instead of the dynamic thrust cap (which fell to 12 deg within 5 s in the 22 Oct 22:08 log and then followed IAS). The dead-engine case keeps EngineOutAoACap. The game caps a damaged engine at 50-100 % of its RPM range by its condition (no afterburner below condition ~0.6), so the weak engine makes 35-75 % of the good one's thrust at AB. Bench, full pulls from 300-400 km/h with the left engine at condition 0 / 0.5: 26-30 hold with 5-8 deg peak sideslip, 36 saturates the yaw once the speed is gone (throttle cut a third of the time, one departure), 45 departs.
# Setting type: Single
# Default value: 40
EngineDamagedAoACap = 40

## Ifrit 0.4.1: thrust-match limiter. With one engine down on thrust (predicted from the engines' damage state: an engine's reachable RPM is minRPM + (maxRPM - minRPM) x (0.5 x condition + 0.5), the dry thrust follows the RPM and the afterburner needs 85 % of maxRPM, i.e. condition above 0.55) and the AoA above EngineDamagedAoACap, the throttle input is held where the two engines still make the same thrust, so there is no thrust split and no AoA cap for it: you keep the full AoA, and the thrust comes back once you bring the AoA down to the cap yourself (on above cap + 2, off under cap + 0.5). Below the cap the throttle is free; the thrust split then brings the fixed EngineDamagedAoACap. With an engine OUT there is nothing to match: above EngineOutAoACap the throttle is held at military power (the afterburner's start). The VMC throttle protection (measured sideslip run-away) stays as the last resort. false = 0.4.0 (dynamic cap from the thrust split, nose pushed down).
# Setting type: Boolean
# Default value: true
EngineAbAoAGate = true

## 2.1.4: with an asymmetric load, past the rudder fade the roll and yaw rate limits also give up the stab deflection that trims the load's roll (the stabs are both the roll and the yaw source there), not only the yaw part of the load; past the rudder fade the yaw anchor and sideslip lead also act at positive AoA; and (2.1.6) a roll brake or reversal accelerates no faster than the yaw left after the load can follow. Only the load beyond the deadbands / a lateral CG offset over 4 cm counts; a clean jet is unchanged. false = 2.1.3. Takes effect at once.
# Setting type: Boolean
# Default value: true
AsymSharedStabLateral = true

## Cap the AoA when an asymmetric load (e.g. one heavy store on one wing) would use more of the roll/yaw control authority than AsymLateralReserve leaves free. The cap is the stick's full-travel AoA (the stick is remapped onto it). A load within the margin is simply trimmed out by the control loop (no cap). Not applied in MPO.
# Setting type: Boolean
# Default value: true
AsymLoadAoALimit = true

## The roll-rate and roll-acceleration limits count only the roll authority left in each direction after the measured asymmetric trim (asymmetric store, wing damage). The trim is learned from the measured non-control roll moment minus roll damping while the jet is not rolling (under 20 deg/s) and held during rolls; it only ever lowers the limit on the loaded side. With the left wing shot off it stops a full right roll at the AoA cap from saturating the stabs and rudders, building sideslip and departing. No effect on a symmetric jet. false = pre-1.8.17.
# Setting type: Boolean
# Default value: true
AsymRollHeadroom = true

## Share of the roll/yaw control authority kept free for the pilot's roll and pedal commands (0..1). Used together with AsymRollReserveAccel / AsymYawReserveAccel: whichever asks for more sets the cap. Higher = lower cap, more roll/yaw left.
# Setting type: Single
# Default value: 0.35
AsymLateralReserve = 0.35

## Asymmetric roll acceleration (deg/s^2) ignored before any cap is considered - the airframe is never perfectly symmetric even clean (off-centre gun and ammunition, engines never exactly matched). The yaw deadband is a quarter of this. A balanced loadout stays well inside it; one 300 kg store is far outside it.
# Setting type: Single
# Default value: 5
AsymDeadbandAccel = 5

## Roll acceleration (deg/s^2) that must stay available to the pilot after the asymmetric load is trimmed out, whatever AsymLateralReserve works out to. Post-stall a share of the remaining authority is almost nothing, so this absolute floor is what sets the cap up high and at low speed. Higher = lower cap.
# Setting type: Single
# Default value: 80
AsymRollReserveAccel = 80

## Same for yaw acceleration (deg/s^2).
# Setting type: Single
# Default value: 20
AsymYawReserveAccel = 20

## DEFAULT 0 (off) since 1.8.17. Hands the CHANGE in the modelled asymmetric moment straight to the allocator, washed out over AsymFeedForwardWashout seconds. Inside the INDI loop an added moment is not a one-off kick: the loop measures the acceleration it causes and settles with a steady roll-rate error of about FF/(I x KRoll) for as long as the term lasts, and while the load keeps changing (pulling, levelling off) it lasts the whole time. With a wing shot off it gave a 20-35 deg/s roll drift in pulls and level-offs and helped depart the jet. The loop already measures the asymmetric moment. 1 = pre-1.8.17.
# Setting type: Single
# Default value: 0
AsymFeedForward = 0

## Time constant (s) over which the feed-forward above hands the load back to the control loop.
# Setting type: Single
# Default value: 1
AsymFeedForwardWashout = 1

## AsymFeedForward fades out over the 12 deg of sideslip above this and is off beyond it: the asymmetric moment it is built from is modelled at zero sideslip, so at large sideslip (falling leaf) it is not a measurement of anything.
# Setting type: Single
# Default value: 6
AsymFeedForwardMaxSideslip = 6

## AsymFeedForward fades out over the 15 deg of AoA above this and is off beyond it. Post-stall the lateral authority it would spend is what the manoeuvre needs.
# Setting type: Single
# Default value: 40
AsymFeedForwardMaxAoA = 40

## The roll reserve also has to cover the roll rate the law allows at this speed, reached in this many seconds. At high IAS that is what sets the reserve (250 deg/s in 0.5 s = 500 deg/s^2), not AsymRollReserveAccel. 0 = off (fixed reserve only).
# Setting type: Single
# Default value: 0.5
AsymRollTau = 0.5

## The cap relaxes faster the further the demand is below the limit: rate = AsymCapRelaxRate x (1 + this x margin). With the load gone the cap comes back at (1 + this) x the base rate. 0 = fixed rate.
# Setting type: Single
# Default value: 4
AsymCapRelaxBoost = 4

## With more than half the lateral authority taken by an asymmetric load, the allocator's roll and yaw weight is raised by up to this factor (1 = up to double) so the surfaces hold the jet straight before they fine-tune pitch. DEFAULT 0 (off) since 1.7.11: it starves the pitch axis, which showed up as the nozzles running nose-down in rolling pulls.
# Setting type: Single
# Default value: 0
AsymAxisPriorityBoost = 0

## The asymmetric-load cap never goes below this positive AoA (deg).
# Setting type: Single
# Default value: 12
AsymMinAoACap = 12

## The asymmetric-load cap never goes closer to 0 than this on the negative side (deg, magnitude).
# Setting type: Single
# Default value: 8
AsymMinAoACapNegative = 8

## How fast the cap comes down when the asymmetry grows (deg/s).
# Setting type: Single
# Default value: 10
AsymCapTightenRate = 10

## How fast the cap goes back up when the asymmetry shrinks (store released, fuel, speed) (deg/s).
# Setting type: Single
# Default value: 8
AsymCapRelaxRate = 8

## Above the cap (it just came down), AoA is brought back to it at up to this rate (deg/s). Not cancelled by full stick.
# Setting type: Single
# Default value: 15
AsymCapRecoveryRate = 15

## Below this IAS (m/s) the cap is held at its last value instead of being recomputed (no aero authority to judge by).
# Setting type: Single
# Default value: 35
AsymMinIAS = 35

## 1.8.45: lateral demand (load share of the authority left after the reserve) at which the asymmetric-load AoA cap sits (1.8.44 and before: 1.0). With a light mixed load (6.5 cm lateral CG offset) the demand rises ~0.025 per degree above the cap, so 1.08 lets ~3 deg more AoA; heavier loads, whose demand rises faster with AoA, gain less.
# Setting type: Single
# Default value: 1.08
AsymCapDemand = 1.08

## 1.8.45: time constant (s) with which the asymmetric-load cap may rise. Each 0.2 s sweep's cap goes through a median of the last three and then this low-pass; a lower cap is followed with 0.3 s. The raw cap moved 1-8 deg every sweep (4.4 Hz) with a 6.5 cm lateral offset at 35-40 deg AoA, which is what made full-aft stick twitch.
# Setting type: Single
# Default value: 1
AsymCapSmoothing = 1

## 1.8.45: seconds of IAS decay projected ahead (filtered IAS rate, rapid decelerations only, see DecelStart/DecelFull). The asymmetric-load cap is judged, and the high-AoA roll/yaw rate limits are set, at the dynamic pressure of that predicted IAS, so they come down before the surfaces lose the authority. 0 = off.
# Setting type: Single
# Default value: 1
DecelLookahead = 1

## 1.8.45: IAS deceleration (m/s^2) below which nothing is anticipated. Between this and DecelFull the deceleration is weighted by the square of where it sits, so ordinary turning bleed (and most of a J-turn's tail) predicts almost nothing and a collapsing corkscrew predicts nearly all of it.
# Setting type: Single
# Default value: 6
DecelStart = 6

## 1.8.45: IAS deceleration (m/s^2) from which it is anticipated in full.
# Setting type: Single
# Default value: 20
DecelFull = 20

[Ground]

## The take-off/landing rotation law (closed-loop pitch with the mains on the ground) only arms above this TAS (m/s). It used to arm at 15 m/s, an ordinary taxi speed, where it flew closed-loop pitch against the ground constraint and threw the surfaces about. It disarms 8 m/s below this.
# Setting type: Single
# Default value: 45
RotationMinSpeed = 45

## 2.0.6: on the runway above RotationMinSpeed, pulling the stick hands pitch to the same rate law as gear-down flight, held through the rotation and lift-off (the rate command, its limits and stick scaling are the airborne ones). Stick neutral or forward with all three wheels down for 0.3 s goes back to the open-loop ground mode (steering, aero-brake). false = 2.0.5 behaviour (open-loop stick until the nose is up, then RotationRate).
# Setting type: Boolean
# Default value: true
GroundRateLaw = true

## 2.0.6: while the nose wheel still touches in the ground rate law, the nose-up pitch moment the FCS asks for may grow by at most this much per second (in deg/s^2 of pitch acceleration). Stops the surfaces winding to full deflection against the nose leg and over-rotating when it lifts.
# Setting type: Single
# Default value: 60
GroundRotationRamp = 60

## 1.8.36: fly-by-wire ground steering. Pedal commands a yaw rate (GroundYawRateMax at taxi speed, limited to GroundLateralAccel of turn at speed); pedal released = yaw braking to zero rate, then the jet holds a straight line along the track it had (a crab/drift at touchdown is steered out, the heading lined up with the track). The nose wheel is steered by the FCS (kinematic feed-forward + yaw-rate feedback) and, in the ground roll, the rudders join the yaw-rate loop. Below 1.5 m/s the pedal steers the wheel directly (pivoting). false = stock: pedal sets the nose-wheel angle, rudders follow the pedal.
# Setting type: Boolean
# Default value: true
NoseWheelFbw = true

## Full-pedal yaw rate on the ground (deg/s) at taxi speed.
# Setting type: Single
# Default value: 15
GroundYawRateMax = 15

## Full pedal never asks for more than this lateral acceleration (m/s^2) in a ground turn: the yaw-rate command is min(GroundYawRateMax, this / ground speed). 2.5 = full pedal gives 2 deg/s at 260 km/h.
# Setting type: Single
# Default value: 2.5
GroundLateralAccel = 2.5

## Pedal released: how strongly the jet steers back onto the straight line it was on (1 = full, 0 = hold the track direction only and accept the sideways offset a gust or touchdown drift left).
# Setting type: Single
# Default value: 1
GroundLineHold = 1

## 0.5.2: with NoseWheelFbw on, stock steering with a drift limit and the straight-line correction. While the pedal is in (and after release until the yaw has stopped) the nose wheel, the rudders and the differential brake get the stock fly-by-wire's yaw, computed with the jet's own stock parameters (yaw-rate command with yaw damping; raw pedal below the stock minimum speed), so the turn is stock; GroundDrift* limit the sideslip on top. Once the yaw has stopped the FCS holds the straight line along the track until the pedal moves; at touchdown it holds the approach track. GroundYawRateMax and GroundLateralAccel are not used. false = the capped yaw-rate law of 1.8.36-0.4.9.
# Setting type: Boolean
# Default value: true
GroundStockMatch = true

## 0.5.3: the negative-AoA push + roll limiters (sideslip lead and yaw-anchored roll, 2.1.0) also act with the gear down in the air (not with a wheel on the ground). false = off with the gear down, as before.
# Setting type: Boolean
# Default value: true
GearDownSlipProtect = true

## 0.5.4: INDI on the nose wheel after the pedal is released - the release braking (stop the yaw) and the straight-line / touchdown hold. The wheel effectiveness comes from the game each tick (nose-leg load, tyre friction and slope, CG and yaw inertia); the measured yaw acceleration covers the rest. While the pedal is in the steering stays stock. false = 2.4.13 (stock law on release, PI line hold).
# Setting type: Boolean
# Default value: true
GroundIndi = true

## 0.5.4: INDI nose wheel: wanted yaw acceleration per deg/s of yaw-rate error (1/s).
# Setting type: Single
# Default value: 15
GroundIndiGain = 15

## Ifrit 1.1.3: while the pedal is in, the main on the pedal's side is braked by |pedal| x this (stock: 0.3, and only 3-30 m/s; this works at any ground speed). The jet pivots harder and the mains break loose, so it drifts. Bench, 3 s full pedal from 15 kt at low thrust: peak sideslip 6.3 deg (1.1.2; also 0.25 and below, where the stock 0.3 underneath wins) -> 10.1 (0.5) -> 12.7 (1.0); speed after 3 s 15.4 -> 12.2 -> 8.9 kt. Never below your own brake. 0 = 1.1.2.
# Setting type: Single
# Default value: 0.5
GroundPedalBrake = 0.5

## Ifrit 1.1.3: when the nose leg goes light during a release stop or the straight-line hold (the jet rocks on its suspension when a hard turn is released), the nose wheel keeps the angle INDI had relative to the contact velocity (at most 1 s) instead of dropping to the stock law's angle (full opposite lock) or 0. The game slews the wheel toward its command even off the ground, so 1.1.2 met the ground again tens of degrees out. Bench, nose unloaded 0.3-0.85 s into a 10 kt release stop (with GroundIndiBrake): stop 1.8 -> 1.43 s. false = 1.1.2.
# Setting type: Boolean
# Default value: true
GroundIndiLightNoseHold = true

## Ifrit 1.1.3: the main-wheel brakes as a second yaw effector for the INDI after the pedal is released (release stop and straight-line hold). The nose wheel goes first; the brake on the outside main takes only the yaw acceleration beyond the nose tyre's grip, read from each main's load, friction and contact velocity every tick. Your own brake is never reduced and the stock differential brake stays underneath. Each main's brake is written directly, so it does not depend on the stock 3-30 m/s window. Costs speed: bench, release from a full-pedal turn at 10 kt: stop 1.37 -> 1.1 s, 3.6 kt lost. false = 1.1.2.
# Setting type: Boolean
# Default value: true
GroundIndiBrake = true

## Ifrit 1.1.3: most brake (0-1) the yaw effector may put on one main. Lower = less speed lost per stop, slower stop. Bench, 10 kt: 0.4 = stop 1.23 s / 1.1 kt lost, 0.6 = 1.18 s / 2.0 kt, 1.0 = 1.10 s / 3.6 kt (1.1.2: 1.37 s).
# Setting type: Single
# Default value: 1
GroundIndiBrakeMax = 1

## Ifrit 1.1.3: full brake authority at and below this ground speed (m/s; 7.7 = 15 kt).
# Setting type: Single
# Default value: 7.7
GroundIndiBrakeFullSpeed = 7.7

## Ifrit 1.1.3: brake authority fades to zero at this ground speed (m/s; 12.9 = 25 kt). Above it the ground steering is 1.1.2.
# Setting type: Single
# Default value: 12.9
GroundIndiBrakeZeroSpeed = 12.9

## 0.5.4: INDI nose wheel: low-pass time constant (s) on the measured yaw acceleration and the tyre-force estimate.
# Setting type: Single
# Default value: 0.04
GroundIndiTau = 0.04

## 0.5.2: sideslip (deg) the jet may drift to on the ground before the steering counters it (stock steering does not limit it). 8 = about half of the Ifrit stock-pedal drift above 50 kt (27 Oct logs: 17-25 deg peaks, 42 in a slalom). 0 = hold the nose on the track; large = no limit.
# Setting type: Single
# Default value: 8
GroundDriftAllow = 8

## 0.5.2: counter-yaw per degree of sideslip past GroundDriftAllow (1 = full pedal; 0.2 = full counter-yaw 5 deg past the allowance). 0 = drift limit off.
# Setting type: Single
# Default value: 0.2
GroundDriftGain = 0.2

## 0.5.2: the drift limit acts on the sideslip predicted this far ahead (s) from its rate, so a fast skid is caught before it overshoots.
# Setting type: Single
# Default value: 0.25
GroundDriftLead = 0.25

## 0.5.2: the drift limit fades in from this ground speed (m/s) to 10 m/s above it (default 15-25 m/s = 29-49 kt), so tight taxi turns keep their natural sideslip.
# Setting type: Single
# Default value: 15
GroundDriftFadeSpeed = 15

