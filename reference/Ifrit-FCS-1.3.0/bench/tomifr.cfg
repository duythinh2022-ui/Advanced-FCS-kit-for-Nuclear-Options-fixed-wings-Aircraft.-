## 1.1.0: the FCS's native core, Ifrit_FcsCore.dll, carried inside this plugin's DLL (1.1.1) (Rust, ported from the F-22E FCS 4.1.0): the control allocator's solves (the main ones each tick and the capacity estimator's probes), and with NativeSweep / NativeTables the asymmetric-load sweep's inner loop and the surface tables' maths. 2 = use it in the game: several times faster, the same laws, the bench's float arithmetic instead of Mono's (Unity runs Mono with floats carried in double, so the C# code differs from any compiled code in the last digits there, and the allocator's picks turn some of those into a different, mostly equal-cost answer for a tick). 1 = use it only where it returns exactly what the C# code returns, bit for bit (the bench; in the game that means C#). 0 = never: the C# code, as 1.0.1. With the DLL missing or failing its checks the C# code runs. Takes effect at once; the tick timer's log line reports what is in use.
# Setting type: Int32
# Default value: 2
# Acceptable values: 0, 1, 2
NativeAllocator = 2

## 1.1.0: when the native allocator is in use, how it is compared with the C# one while flying. 0 = not at all: every solve is the native one. 1 = each allocator's first 64 solves and every 256th after them are solved both ways, and the C# result is the one used on those. 2 = every solve both ways, the C# result used on all of them (a comparison flight: the jet flies C# and pays for both). The tick timer's log line reports the counts: identical, close (commands within 0.001 deg), an equal-cost alternative (costs within 0.1 %), different. Where float arithmetic is strict, anything but identical is a fault: one warning in BepInEx/LogOutput.log and the native solve is switched off until the game restarts. Takes effect at once.
