## Settings file was created by plugin KR-67 Ifrit FCS v1.2.0
## Plugin GUID: Ifrit_KR67.FCS

[1. General]

## Stock (default) = the game's KR-67 thrust, parasitic drag and fuel burn, with 35 % of the AoA-dependent drag removed up to 25 deg AoA, faded out by 30 (post-stall drag is stock), see StockAoADragRelief. Buffed (Ifrit 0.2.2) = thrust x1.08 (dry and afterburner), parasitic drag x0.95, the same low-AoA drag relief going over to 0.25 post-stall, transonic drag relief 0.1, fuel burn x0.75. Countermeasures and gun ammo come from the matching Countermeasures section below. The flight control is the same in both. Switch before spawning: thrust, drag, countermeasures and ammo are set when a jet spawns and stay until it respawns; fuel burn follows the setting live.
# Setting type: PerformanceProfile
# Default value: Stock
# Acceptable values: Buffed, Stock
PerformanceProfile = Buffed

## Ifrit 0.2.1: what opens the split decelerons (the Ifrit's airbrake, in the air and on the ground). true = the brake key / axis only; idle throttle is just idle. false = 0.5.5: the stock rule only: throttle at zero opens them; the brake key is the wheel brake only (it no longer opens them, so Brake and Countermeasures can share a controller button). Only while the FCS flies the jet.
# Setting type: Boolean
# Default value: true
ThrottleIndependentAirbrake = true

## Replace the stock fly-by-wire with the Ifrit FCS (player aircraft only).
# Setting type: Boolean
# Default value: true
Enabled = true

## 2.0.6: true = the pitch stick is a pitch-rate command in every mode (gear up or down, on the runway, Stability Assist on or off), like the gear-down law. With Stability Assist on, the AoA and G limits and AoA protection still apply; with it off (MPO) the MPO limits apply as before. false = AoA/G command with the gear up (default). Takes effect at once.
# Setting type: Boolean
# Default value: false
PitchRateCommandOnly = false

## 2.1.0: the gear-up pitch law (Stability Assist on). GAndPitchRate (default) = the stick commands pitch rate where full G is out of reach (low IAS) and G where it is in reach, blended as before; no AoA command - the AoA limits, the low-thrust / asymmetric-load caps and AoA protection still apply as limits. GAoAAndPitchRate = the 1.9-2.0 law: AoA command at low IAS (stick curve in section 5), G command at high IAS, pitch-rate command past the hand-over AoA. AoAThenRateHold (2.1.8) = as GAoAAndPitchRate, but once the stick is steady and the AoA has settled on its command, the pitch rate the jet has then is held instead of the AoA (the AoA drifts with speed); moving the stick goes back to AoA command. PitchRateCommandOnly = true overrides all of them. Takes effect at once.
# Setting type: PitchCommandLaw
# Default value: GAndPitchRate
# Acceptable values: GAndPitchRate, GAoAAndPitchRate, AoAThenRateHold
PitchCommandLaw = GAndPitchRate

## Ifrit 0.3.1: high-AoA lateral braking margin. Above HighAoALateralMarginFull (30 deg AoA, dev cfg) the roll- and yaw-rate limits are multiplied by this, blended in smoothly from HighAoALateralMarginStart (25). 0.86 = 14 % less allowed stop time: 14 % less roll and yaw rate for the same authority, the rotation stops sooner. 1 = 0.3.0. Takes effect at once.
# Setting type: Single
# Default value: 0.86
# Acceptable value range: From 0.5 to 1.5
HighAoALateralBrakeMargin = 0.86

## Ifrit 0.3.1 (default SeparateRollYaw since 0.3.7): the lateral law with Stability Assist off (MPO). VelocityVectorRoll = as with it on: the stick rolls about the velocity vector, the sideslip is held and the pedals work as they do with it on. SeparateRollYaw (default) = the 0.2.0-0.3.0 MPO law: the stick commands body roll rate and the pedals body yaw rate, with no coordination or sideslip hold (the jet rolls about the velocity vector only when roll and yaw are applied together). Takes effect at once.
# Setting type: MpoRollMode
# Default value: SeparateRollYaw
# Acceptable values: VelocityVectorRoll, SeparateRollYaw
MpoRollMode = SeparateRollYaw

## Ifrit 1.1.2: with Stability Assist off (MPO) and MpoRollMode = SeparateRollYaw, the roll stick's body roll is limited only by what the roll axis can do (control surfaces plus roll nozzles), not by sideslip: the high-AoA braking floor, the high-AoA lateral margin, the fin-damage / engine-out yaw-share cuts and the yaw axis's saturation no longer hold the roll back. The roll rate may reach what surfaces + nozzles stop in RollStopFactor s, and the roll stops when the stick is released with the nozzles helping. Roll stick + pedal together (velocity-vector roll) is unchanged. false = 1.1.1. Takes effect at once.
# Setting type: Boolean
# Default value: true
MpoFreeRoll = true

## Time constant (s) of the first-order smoothing on pitch/roll/pedal inputs. 0 = off.
# Setting type: Single
# Default value: 0.06
StickSmoothing = 0.06

[2. AI]

## Ifrit 0.1.0: off by default (every AI Ifrit in a mission would otherwise fly this port). AI-flown F-22Es (simulated on this machine, no human pilot) also fly the FCS: everything the player gets (allocator, TVC, flaps, limits, damage protection) except the pitch law, which is pitch-rate command with the stock fly-by-wire's own stick-to-rate gain (so the AI's autopilot tuning still fits), inside the FCS AoA/G limits. Telemetry is never written for AI jets. false = AI F-22Es fly the stock fly-by-wire on the modified airframe (pre-1.8.22).
# Setting type: Boolean
# Default value: false
AIFlightControl = false

## AI F-22Es only: the AI's roll stick drives the velocity-vector roll rate almost directly (up to the jet's roll authority, still capped by the yaw authority at high AoA), like the stock fly-by-wire, instead of through the player's smooth roll trajectory. The AI's roll autopilot is a PID tuned for the stock response; the extra lag of the smooth trajectory made it overshoot and roll back and forth. false = 1.8.24 behaviour.
# Setting type: Boolean
# Default value: true
AIDirectRoll = true

## AI F-22Es only: while the AI points its nose (guns) at a moving target, its roll stick is faded out when the aim error is under ~6 deg (none under 1 deg). Near the aim point the AI's 'put the lift vector on the target' roll logic has no stable answer and flips between rolling left and right every second; pitch and rudder close the last few degrees instead. false = off.
# Setting type: Boolean
# Default value: true
AIGunRollFade = true

