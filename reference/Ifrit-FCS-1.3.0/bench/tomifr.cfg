[5. Pitch stick curve]

## 2.0.12 (default 0.6 since 2.0.15; 0.45 in 2.0.13-2.0.14): pull-stick position (0..1) that commands 24 deg AoA. 0.333 = the standard 72 deg per full stick line. Allowed 0.083-0.7: lower = more AoA early in the pull (sharper), higher = less (softer, finer control at low AoA). The curve through 0, this point and the 36 deg point is smooth (monotone cubic), so the gain changes gradually instead of at a corner. Takes effect at once.
# Setting type: Single
# Default value: 0.6
StickFor24degAoA = 0.6

## 2.0.12 (default 0.8 since 2.0.15; 0.65 in 2.0.13-2.0.14): pull-stick position (0..1) that commands 36 deg AoA (on the standard line: 0.5). Allowed 0.3-0.8, and always at least 0.1 of stick past StickFor24degAoA (if set closer it is moved out to 24's point + 0.1, so 36 can never come at or before 24). Past 36 the curve continues to the AoA limit at full stick as before (the high-AoA rate hand-over is unchanged). Applies to the pull side; the push side keeps the 72 deg per stick line. Takes effect at once.
# Setting type: Single
# Default value: 0.8
StickFor36degAoA = 0.8

## Internal: the stick-curve default revision this file was last updated to. Leave it alone.
# Setting type: Int32
# Default value: 0
StickCurveRevision = 2

[6. Lateral governor]

## 2.2.8 (2.2.23: default 0 -> 0.7; 2.2.26: 1; 2.2.27: back to 0.7): in a rolling pull the yaw cannot keep up with, how much of the shortfall is paid by slowing the roll and how much by slowing the AoA rise (the sideslip a rising AoA makes goes as roll rate x AoA rate). 0 = roll kept, AoA rise limited. 1 = roll slowed (to no less than 30 deg/s) until the asked AoA rise fits; in between, the roll limit goes that share of the way and the pitch covers the rest (F-22E 2.6.4/2.6.5). The roll comes back once the AoA rise is no longer limited. Takes effect at once.
# Setting type: Single
# Default value: 0.7
PullRollTrade = 0.7

## Ifrit FCS 0.11.0: default 8 -> 6 (Tom, 5 Nov 01:10: roll reversals at low to mid AoA made 7-9 deg, the margin spent in every one; 2 deg less, at some roll rate there). Ifrit FCS 0.7.0: default 8 (the F-22E flies 4). The old lateral stack flew this jet with PullSideslipMargin 15 and made 5-9 deg of sideslip in high-AoA rolls on the bench; the governor at 4 held the 1 Nov flight to 1.5-2.8 (95th percentile) and the falling-leaf yaw rate to 46 deg/s against the 60-65 you had. 8 is nearer where this jet was; lower = cleaner stops, slower rolls. F-22E 2.4.17 (2.5.0: 3 -> 4): sideslip (deg) a roll stop or reversal is allowed to make; the lateral governor caps the commanded roll rate (never the roll acceleration or braking) to the rate whose full stick reversal the yaw can follow within it. The one margin at every AoA (no schedule); the airframe probe (RollStopSlipProbe) can only lower it. A handling (sway) number: lower = slower rolls at moderate AoA, cleaner stops. Allowed 1-15. Takes effect at once.
# Setting type: Single
# Default value: 6
RollStopSideslip = 6

## Internal: the lateral-governor default revision this file was last updated to. Leave it alone.
# Setting type: Int32
# Default value: 0
GovernorRevision = 5

## F-22E 2.5.2, rebuilt 2.5.3-2.6.6: roll first, then pitch, both ways. With the roll already held to its cap, the AoA rate the pitch law may command under the roll is held to what the yaw can pay for: an AoA sweep changes the yaw the pair needs at roll rate x cos AoA x AoA rate. Nose-up at positive AoA: 0.8 x the rudders' braking yaw not yet in use on the roll's side, faded in with the rudders' braking yaw and only as the forecast sideslip heads past 75 % of the margin - a rolling pull that pins the rudders but holds its sideslip keeps its pitch rate. Every other sweep (nose-down anywhere, nose-up from negative AoA): 0.5 x the yaw authority plus half the roll's, from the same rule, at every IAS; a sweep toward zero AoA under a body yaw rate is paced so the yaw that will have nothing to coordinate at zero AoA is shed first (weighted by 1 - cos AoA, so the nose is let through near zero). Never under 6 deg/s of AoA rate; released over 0.3 s. false = the trade alone. Takes effect at once.
# Setting type: Boolean
# Default value: true
RollGovernorPitch = true

## F-22E 2.5.10: how much of the sideslip margin the roll-rate cap spends - the roll rate / sideslip compromise. 1 = the cap aims a full stick reversal at the margin as set. Above 1 the cap aims past the margin and lets the roll run faster (F-22E bench, margin 15: worst / mean sideslip and mean roll rate 5.8 / 3.9 at 52 deg/s for 1.0, 8.3 / 4.8 at 59 for 1.25, 10.7 / 6.3 at 67 for 1.67, 13.0 / 7.6 at 74 for 2.0, against 10.9 / 8.0 at 83 with no cap); the game's worst held-roll reversal reads about 1.4x the bench's. Below 1 the cap is stricter than the margin. Allowed 0.5-3. Takes effect at once.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 3
RollPaceRateSlip = 1

## Ifrit FCS 0.13.1: default 0.65 -> 0.4 (Tom, 5 Nov 10:16). Ifrit FCS 0.12.0: default 0 -> 0.65 with the Raptor's rate-cap model (Tom, 5 Nov 02:01). F-22E 2.5.11: how the pace governor splits its work between its two laws. 0 = pacing only (the yaw-reach window holds the roll target while the yaw catches up and the trajectory's acceleration / braking is capped at the yaw's authority: reversals are paced, the margin does not matter). 1 = rate cap only (the target is capped at the rate whose stick reversal lands on the sideslip margin x RollPaceRateSlip; acceleration and braking stay as tuned: reversals are crisp, the rate is lower). Between: the proportional mix of the two targets, and the acceleration cap gives way to the tuned acceleration in the same proportion. The F-22E flies at ~0.4. Allowed 0-1. Takes effect at once.
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0 to 1
RollPaceRateBlend = 0.3964789

## F-22E 2.5.15/2.5.16: the airframe's own sideslip tolerance, measured from its aero tables in flight - no number entered. Twice a second the FCS evaluates the whole airframe (every aero part at the game's per-part law, the surfaces where they are) at the present AoA and a sweep of hypothetical sideslip to 20 deg each way, and finds the sideslip where the restoring yaw moment stops growing (directional stiffness gone - the departure boundary) and where the yaw effectors' or the roll surfaces' authority has fallen to half of its zero-sideslip value. The smaller, x 0.7, caps RollStopSideslip. On an airframe with nothing inside 20 deg the cap never binds and RollStopSideslip rules; on one with a soft fin it binds where the fin gives out. Telemetry: slipTol / slipDep / slipAuth / slipStiff. false = RollStopSideslip alone. Takes effect at once.
# Setting type: Boolean
# Default value: true
RollStopSlipProbe = true

## Ifrit 0.9.0 (the F-22E 3.0.0 push governor and push plan): 8, set explicitly (Tom, 4 Nov: the stock jets' RollStopSideslip, not the F-22E's 4); -1 = follow RollStopSideslip. F-22E 2.9.4: sideslip (deg) a push-over from high AoA may make at the zero crossing from the yaw rate still on board. The sweep is paced so the yaw above what that allowance can absorb (r = sqrt(2 x measured shed x allowance)) is shed before the AoA reaches zero; the rest is left to the rudders at low AoA. Higher = faster nose-down with a high yaw rate on, more sideslip at the bottom. -1 = RollStopSideslip. 0-20. Takes effect at once.
# Setting type: Single
# Default value: 8
PushoverSideslip = 8

