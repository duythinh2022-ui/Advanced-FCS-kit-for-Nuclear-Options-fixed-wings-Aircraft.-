# Default value: 150
YawStopTimeFullIAS = 150

## 1.9.3: allowed yaw stop time at low IAS relative to the reference: 1.5 = 50 % more yaw rate for the same yaw authority (slower braking). 1 = flat. (1.9.2's YawBrakeMargin* keys worked the other way and are no longer read.)
# Setting type: Single
# Default value: 1.5
