## Ifrit 0.4.0: read on the HOST (or dedicated server). true = players who run this plugin may fly their Ifrits with its control laws on this server. false = every client flies the stock fly-by-wire. A client whose host does not run this plugin always flies stock (fly-by-wire, thrust, drag, fuel burn, countermeasures and ammo), whatever its own settings. Ifrit 0.4.1: the host's own jet is bound by this switch too (false = the host flies stock as well). While this or HostLockVariant is on, the server is flagged as modded (server browser / NOMM 'Modded' tag).
# Setting type: Boolean
