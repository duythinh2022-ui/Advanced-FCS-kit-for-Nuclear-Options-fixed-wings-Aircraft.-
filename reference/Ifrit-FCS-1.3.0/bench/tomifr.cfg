HostAllowFcs = true

## Ifrit 0.4.0: read on the HOST. Ifrit 0.4.7: on by default. true = every client gets the host's variant: the host's PerformanceProfile with its thrust, drag and fuel-burn scaling and the host's countermeasure and gun-ammo capacities from the matching Countermeasures section. false = every client flies the Stock variant with stock countermeasures and ammo (their own profile and capacity settings are ignored while connected). Ifrit 0.4.1: with the lock off the host flies the Stock variant on its own server as well; the host's PerformanceProfile is used in multiplayer only through this lock. Changes are sent to the clients at once and apply at the next spawn.
