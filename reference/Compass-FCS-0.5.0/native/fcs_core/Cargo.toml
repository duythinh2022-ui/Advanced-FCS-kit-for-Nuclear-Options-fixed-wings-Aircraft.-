[package]
name = "compass_fcs_core"
version = "0.3.0"
edition = "2021"
description = "Compass FCS (port of the F-22E Strike Raptor FCS 4.1.0 core): the control allocator's solve and the surface grid kernels, native (bit-identical on strict float runtimes)"
publish = false

[lib]
name = "Compass_FcsCore"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"      # a panic is caught at the FFI boundary and returned as an error code (the plugin then solves in C#)
debug = false
strip = true
overflow-checks = false
